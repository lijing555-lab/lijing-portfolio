<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>河北省自然资源时空智能底座</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#070e1e;--panel:rgba(8,16,36,0.95);--card:rgba(12,24,52,0.9);
--border:rgba(30,80,160,0.35);--t1:#e0e8f0;--t2:#8899b0;--t3:#5a6a80;
--blue:#0099ff;--cyan:#00d4ff;--green:#00e676;--orange:#ff8800;
--red:#ff3d3d;--purple:#b060ff;--yellow:#ffcc00;--teal:#00bfa5;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--t1);font-family:'Microsoft YaHei',sans-serif;font-size:13px}
#app{display:flex;flex-direction:column;height:100vh}

/* Header */
#header{background:linear-gradient(135deg,#0a1a3a 0%,#0d2550 100%);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;gap:24px;flex-shrink:0;z-index:1000}
.logo{font-size:18px;font-weight:bold;color:var(--cyan);white-space:nowrap;letter-spacing:1px}
.logo .sub{font-size:11px;color:var(--t2);font-weight:normal;margin-left:8px}
.tabs{display:flex;gap:4px;flex:1}
.tab{padding:8px 16px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--t2);cursor:pointer;font-size:13px;transition:all .2s;white-space:nowrap}
.tab:hover{color:var(--t1);background:rgba(0,153,255,0.1)}
.tab.active{color:#fff;background:rgba(0,153,255,0.2);border-color:var(--blue)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle}
.header-right{display:flex;align-items:center;gap:16px}
.status-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--green)}
.status-badge .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.clock{font-size:13px;color:var(--cyan);font-variant-numeric:tabular-nums}

/* Main Layout */
#main{display:flex;flex:1;overflow:hidden}
#left-panel{width:340px;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
#map-wrap{flex:1;position:relative;overflow:hidden}
#map{width:100%;height:100%;background:#0a1628}
#right-panel{width:380px;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;flex-shrink:0}

/* Left Panel */
.agent-header{padding:16px;border-bottom:1px solid var(--border)}
.agent-name{font-size:16px;font-weight:bold;color:var(--t1)}
.agent-desc{font-size:12px;color:var(--t2);margin-top:4px;line-height:1.5}
.agent-status{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px}
.agent-status .badge{padding:2px 8px;border-radius:3px;font-size:11px}
.badge-online{background:rgba(0,230,118,0.15);color:var(--green)}
.badge-running{background:rgba(0,153,255,0.15);color:var(--blue)}

/* Thinking Chain */
.thinking-chain{padding:12px 16px}
.chain-title{font-size:12px;color:var(--cyan);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.chain-step{background:var(--card);border-radius:6px;padding:10px 12px;margin-bottom:8px;border-left:3px solid var(--blue);font-size:12px;line-height:1.6}
.chain-step .step-label{font-size:10px;color:var(--t3);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.chain-step .step-content{color:var(--t1)}
.chain-step[data-type="source"]{border-left-color:var(--blue)}
.chain-step[data-type="source"] .step-label{color:var(--blue)}
.chain-step[data-type="reason"]{border-left-color:var(--purple)}
.chain-step[data-type="reason"] .step-label{color:var(--purple)}
.chain-step[data-type="action"]{border-left-color:var(--green)}
.chain-step[data-type="action"] .step-label{color:var(--green)}
.chain-step .auth-tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;margin-left:4px}
.auth-auto{background:rgba(0,230,118,0.15);color:var(--green)}
.auth-manual{background:rgba(255,136,0,0.15);color:var(--orange)}
.auth-pending{background:rgba(255,204,0,0.15);color:var(--yellow)}

/* Right Panel */
.right-section{padding:14px 16px;border-bottom:1px solid var(--border)}
.right-section h3{font-size:13px;color:var(--t1);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric-card{background:var(--card);border-radius:6px;padding:10px 12px;border:1px solid var(--border)}
.metric-card .label{font-size:11px;color:var(--t2)}
.metric-card .value{font-size:22px;font-weight:bold;margin-top:4px;font-variant-numeric:tabular-nums}
.metric-card .unit{font-size:11px;color:var(--t3);margin-left:2px}
.metric-card .trend{font-size:11px;margin-top:2px}
.trend-up{color:var(--red)}
.trend-down{color:var(--green)}
.trend-flat{color:var(--t2)}

.alert-item{background:var(--card);border-radius:6px;padding:10px 12px;margin-bottom:8px;border-left:3px solid var(--orange);font-size:12px;line-height:1.5}
.alert-item .alert-time{font-size:10px;color:var(--t3);margin-bottom:4px}
.alert-item .alert-title{color:var(--t1);font-weight:bold;margin-bottom:2px}
.alert-item .alert-desc{color:var(--t2)}
.alert-item.high{border-left-color:var(--red)}
.alert-item.medium{border-left-color:var(--orange)}
.alert-item.low{border-left-color:var(--yellow)}

.task-list .task-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(30,80,160,0.15);font-size:12px}
.task-item:last-child{border-bottom:none}
.task-item .task-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.task-icon.done{background:rgba(0,230,118,0.15);color:var(--green)}
.task-icon.progress{background:rgba(0,153,255,0.15);color:var(--blue)}
.task-icon.pending{background:rgba(255,204,0,0.15);color:var(--yellow)}
.task-item .task-text{flex:1;color:var(--t1)}
.task-item .task-tag{font-size:10px;color:var(--t3);padding:1px 6px;background:rgba(255,255,255,0.05);border-radius:3px}

/* Map overlays */
.map-overlay-top{position:absolute;top:12px;left:12px;z-index:500;display:flex;gap:8px;flex-wrap:wrap;max-width:60%}
.map-chip{background:rgba(8,16,36,0.85);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:11px;color:var(--t2);cursor:pointer;transition:all .2s}
.map-chip:hover{color:var(--t1);border-color:var(--blue)}
.map-chip.active{color:var(--cyan);border-color:var(--cyan);background:rgba(0,212,255,0.1)}

.map-legend{position:absolute;bottom:12px;left:12px;z-index:500;background:rgba(8,16,36,0.9);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:11px}
.map-legend .legend-title{color:var(--t2);margin-bottom:6px;font-size:10px}
.map-legend .legend-item{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.map-legend .legend-color{width:12px;height:12px;border-radius:2px}

/* AI Dialog */
#ai-dialog{position:absolute;bottom:0;left:340px;right:380px;background:var(--panel);border-top:1px solid var(--border);max-height:200px;display:flex;flex-direction:column;z-index:600;transition:all .3s}
#ai-dialog.collapsed{max-height:40px}
.ai-dialog-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;cursor:pointer;border-bottom:1px solid var(--border)}
.ai-dialog-header .title{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--cyan)}
.ai-dialog-header .title .ai-icon{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:12px}
.ai-dialog-body{padding:10px 16px;overflow-y:auto;max-height:150px}
.ai-msg{margin-bottom:8px;font-size:12px;line-height:1.6}
.ai-msg .role{font-weight:bold;margin-right:6px}
.ai-msg.user .role{color:var(--cyan)}
.ai-msg.ai .role{color:var(--blue)}
.ai-msg .msg-block{display:inline-block;padding:4px 8px;border-radius:4px;margin:2px 0}
.ai-msg .block-source{border:1px solid rgba(0,153,255,0.3);background:rgba(0,153,255,0.05)}
.ai-msg .block-reason{border:1px solid rgba(176,96,255,0.3);background:rgba(176,96,255,0.05)}
.ai-msg .block-action{border:1px solid rgba(0,230,118,0.3);background:rgba(0,230,118,0.05)}

/* Leaflet overrides */
.leaflet-container{background:#0a1628!important}
.leaflet-tile-pane{filter:saturate(0.4) brightness(0.55) contrast(1.2)}
.leaflet-control-zoom{border:1px solid var(--border)!important}
.leaflet-control-zoom a{background:rgba(8,16,36,0.9)!important;color:var(--t1)!important;border-bottom:1px solid var(--border)!important}
.leaflet-control-zoom a:hover{background:rgba(0,153,255,0.2)!important}
.leaflet-popup-content-wrapper{background:rgba(8,16,36,0.95)!important;color:var(--t1)!important;border:1px solid var(--blue)!important;border-radius:6px!important}
.leaflet-popup-tip{background:rgba(8,16,36,0.95)!important}
.leaflet-popup-content{margin:10px 14px!important;font-size:12px!important;line-height:1.5!important}
.leaflet-popup-content .popup-title{color:var(--cyan);font-weight:bold;margin-bottom:4px}
.leaflet-popup-content .popup-row{color:var(--t2);margin-top:2px}
.leaflet-popup-content .popup-row span{color:var(--t1)}

/* Custom markers */
.custom-marker{background:transparent;border:none}
.marker-pulse{width:12px;height:12px;border-radius:50%;border:2px solid;animation:markerPulse 2s infinite}
@keyframes markerPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,0.4)}70%{box-shadow:0 0 0 10px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(30,80,160,0.3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(30,80,160,0.5)}

/* Toast */
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(8,16,36,0.95);border:1px solid var(--blue);border-radius:6px;padding:8px 20px;font-size:13px;color:var(--cyan);z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}

/* Scenario-specific colors */
.theme-overview{--theme:#00d4ff}
.theme-survey{--theme:#00d4ff}
.theme-planning{--theme:#b060ff}
.theme-farmland{--theme:#00e676}
.theme-ecology{--theme:#8bc34a}
.theme-geohazard{--theme:#ff3d3d}

/* Progress bar */
.progress-bar{height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;margin-top:4px}
.progress-bar .fill{height:100%;border-radius:2px;transition:width .5s}

/* Table */
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{background:rgba(0,153,255,0.1);color:var(--cyan);padding:6px 8px;text-align:left;font-weight:normal;border-bottom:1px solid var(--border);font-size:11px}
.data-table td{padding:6px 8px;border-bottom:1px solid rgba(30,80,160,0.15);color:var(--t1)}
.data-table tr:hover td{background:rgba(0,153,255,0.05)}

/* Image comparison */
.img-compare{display:flex;gap:8px;margin-top:8px}
.img-compare .img-box{flex:1;background:var(--card);border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.img-compare .img-label{font-size:10px;color:var(--t3);padding:4px 8px;text-align:center}
.img-compare .img-placeholder{height:80px;display:flex;align-items:center;justify-content:center;font-size:24px}
</style>
</head>
<body>
<div id="app" class="theme-overview">
<div id="header">
<div class="logo">河北省自然资源时空智能底座<span class="sub">CIM + 大模型 + 智能体</span></div>
<nav class="tabs" id="tabs">
<button class="tab active" data-agent="overview"><span class="dot" style="background:#00d4ff"></span>总览驾驶舱</button>
<button class="tab" data-agent="survey"><span class="dot" style="background:#00d4ff"></span>调查监测</button>

<div class="header-right">
<div class="status-badge"><span class="pulse"></span>系统运行中</div>
<div class="clock" id="clock">--:--:--</div>
</div>
</div>
<div id="main">
<div id="left-panel"></div>
<div id="map-wrap">
<div id="map"></div>
<div class="map-overlay-top" id="mapLayers"></div>
<div class="map-legend" id="mapLegend"></div>
<div id="toast"></div>
</div>
<div id="right-panel"></div>
</div>
<div id="ai-dialog">
<div class="ai-dialog-header" onclick="toggleDialog()">

<span style="color:var(--t2);font-size:12px" id="dialogToggle">收起 ▾</span>

<div class="ai-dialog-body" id="dialogBody"></div>
</div>
</div>

function toggleDialog(){

if(dlg.classList.contains('collapsed')){
dlg.classList.remove('collapsed');
toggle.textContent='收起 ▾';
}else{
dlg.classList.add('collapsed');

function showToast(msg){
var t=document.getElementById('toast');
t.textContent=msg;
t.classList.add('show');
setTimeout(function(){t.classList.remove('show')},2000);
}

// Clock
function updateClock(){
var d=new Date();
var h=String(d.getHours()).padStart(2,'0');
var m=String(d.getMinutes()).padStart(2,'0');
var s=String(d.getSeconds()).padStart(2,'0');
document.getElementById('clock').textContent=h+':'+m+':'+s;
}
setInterval(updateClock,1000);
updateClock();

// Initial render
render();

// Simulate real-time alert
setTimeout(function(){
showToast('新预警: 保定涞源县滑坡风险升至橙色');
