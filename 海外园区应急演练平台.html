<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>海外园区应急演练智能体平台</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--bg:#0a0e14;--card:#131820;--card2:#1a2030;--border:#2a3548;--t1:#e0e8f0;--t2:#8899b0;--t3:#6a7a90;--blue:#0099ff;--cyan:#00d4ff;--green:#00e676;--purple:#b060ff;--orange:#ff8800;--red:#ff3d3d;--yellow:#ffc800;--teal:#00bfa5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--t1);font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:14px}
.header{position:fixed;top:0;left:0;right:0;height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;z-index:1000}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--cyan),var(--blue));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-text{font-size:15px;font-weight:600}.logo-text .sub{font-size:10px;color:var(--t2);font-weight:400;display:block;line-height:1.2}
.nav-bar{display:flex;gap:2px;margin-left:32px;height:100%;align-items:flex-end}
.nav-item{padding:8px 20px;font-size:14px;color:var(--t2);cursor:pointer;position:relative;transition:color .2s;border-radius:6px 6px 0 0}
.nav-item:hover{color:var(--t1)}
.nav-item.active{color:var(--cyan)}
.nav-item.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--cyan)}
.nav-idx{font-size:10px;color:var(--t3);margin-right:4px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:12px;color:var(--t2)}
.stat-item{display:flex;align-items:center;gap:4px}
.dot-on{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pd 2s infinite}
@keyframes pd{50%{opacity:.4}}
@keyframes pm{0%{box-shadow:0 0 0 0 rgba(255,61,61,.6)}70%{box-shadow:0 0 0 12px rgba(255,61,61,0)}100%{box-shadow:0 0 0 0 rgba(255,61,61,0)}}
.stat-val{color:var(--t1);font-weight:600;font-size:14px}
#clock{font-family:'Cascadia Code',monospace;color:var(--cyan)}
.main{position:fixed;top:56px;left:0;right:0;bottom:0;display:flex}
.map-area{flex:1;position:relative;overflow:hidden}
#map{width:100%;height:100%;background:#0a0e14;z-index:1}
#three-container{position:absolute;inset:0;z-index:2;display:none}
#three-container.show{display:block}
.leaflet-tile-pane{filter:brightness(.85) contrast(1.15)}
.leaflet-container{background:#0a0e14}
.leaflet-control-attribution{display:none}
.map-tools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:500}
.map-btn{background:var(--card);border:1px solid var(--border);color:var(--t2);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;backdrop-filter:blur(8px);transition:all .2s}
.map-btn:hover{color:var(--t1);border-color:var(--blue)}
.map-btn.active{background:rgba(0,153,255,.15);color:var(--cyan);border-color:var(--blue)}
.map-legend{position:absolute;bottom:12px;right:12px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:12px;z-index:500;backdrop-filter:blur(8px)}
.legend-title{color:var(--t2);margin-bottom:6px;font-weight:600}
.legend-row{display:flex;align-items:center;gap:8px;margin:3px 0}
.legend-color{width:12px;height:12px;border-radius:50%}
.side-panel{width:420px;background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel-body{flex:1;overflow-y:auto;padding:12px}
.panel-body::-webkit-scrollbar{width:6px}
.panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.panel-body::-webkit-scrollbar-track{background:transparent}
.fp-section{margin-bottom:14px}
.fp-title{font-size:12px;color:var(--t2);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.5px}
.fp-card{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}
.fp-card.accent-cyan{border-left:3px solid var(--cyan)}
.fp-card.accent-purple{border-left:3px solid var(--purple)}
.fp-card.accent-orange{border-left:3px solid var(--orange)}
.fp-card.accent-green{border-left:3px solid var(--green)}
.fp-card.accent-blue{border-left:3px solid var(--blue)}
.fp-card.accent-yellow{border-left:3px solid var(--yellow)}
.fp-card.accent-red{border-left:3px solid var(--red)}
.fp-card.accent-teal{border-left:3px solid var(--teal)}
.fp-card-header{display:flex;align-items:center;margin-bottom:8px}
.fp-card-title{font-size:13px;font-weight:600;flex:1}
.fp-row{display:flex;align-items:center;padding:6px 0;border-bottom:1px solid rgba(42,53,72,.5)}
.fp-row:last-child{border-bottom:none}
.fp-row .label{color:var(--t2);font-size:12px;min-width:80px}
.fp-row .val{color:var(--t1);font-size:12px;font-weight:500;margin-left:auto;text-align:right}
.fp-btn{padding:8px 16px;border:1px solid var(--border);border-radius:6px;background:var(--card2);color:var(--t1);font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit}
.fp-btn:hover{border-color:var(--blue);background:rgba(0,153,255,.1)}
.fp-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.fp-btn.primary:hover{background:#0080e0}
.fp-btn.full{width:100%}
.fp-select{padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--t1);font-size:12px;font-family:inherit;cursor:pointer}
.fp-input{padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--t1);font-size:12px;font-family:inherit}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag.cyan{background:rgba(0,212,255,.15);color:var(--cyan)}
.tag.purple{background:rgba(176,96,255,.15);color:var(--purple)}
.tag.orange{background:rgba(255,136,0,.15);color:var(--orange)}
.tag.green{background:rgba(0,230,118,.15);color:var(--green)}
.tag.blue{background:rgba(0,153,255,.15);color:var(--blue)}
.tag.yellow{background:rgba(255,200,0,.15);color:var(--yellow)}
.tag.red{background:rgba(255,61,61,.15);color:var(--red)}
.tag.teal{background:rgba(0,191,165,.15);color:var(--teal)}
.tag.gray{background:rgba(136,153,176,.15);color:var(--t2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--bg);border-radius:6px;padding:8px;text-align:center}
.stat-val{font-size:18px;font-weight:700}.stat-label{font-size:10px;color:var(--t2);margin-top:2px}
.scenario-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.scenario-card{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:all .2s;text-align:center}
.scenario-card:hover{border-color:var(--blue);background:rgba(0,153,255,.05)}
.scenario-card.active{border-color:var(--cyan);background:rgba(0,212,255,.08)}
.sc-icon{font-size:22px;margin-bottom:4px}.sc-name{font-size:11px;font-weight:600}.sc-sev{font-size:10px;color:var(--t3);margin-top:2px}
.agent-row{display:flex;align-items:center;gap:8px;padding:8px;background:var(--bg);border-radius:6px;cursor:pointer;transition:all .2s}
.agent-row:hover{background:rgba(0,153,255,.05)}
.agent-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.agent-info{flex:1;min-width:0}.agent-name{font-size:12px;font-weight:600}.agent-meta{font-size:10px;color:var(--t3)}
.agent-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.tl-container{position:relative;padding-left:20px}
.tl-node{position:relative;padding:0 0 16px 16px;border-left:2px solid var(--border)}
.tl-node:last-child{border-left-color:transparent}
.tl-node::before{content:'';position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--cyan)}
.tl-node.done::before{background:var(--cyan)}
.tl-node.active::before{background:var(--orange);box-shadow:0 0 8px var(--orange)}
.tl-time{font-size:11px;color:var(--t3);font-family:'Cascadia Code',monospace}
.tl-title{font-size:13px;font-weight:600;margin:2px 0}.tl-desc{font-size:12px;color:var(--t2);line-height:1.4}
.replay-timeline{position:relative;height:60px;background:var(--bg);border-radius:8px;border:1px solid var(--border);margin:12px 0;cursor:pointer}
.replay-track{position:absolute;top:50%;left:0;right:0;height:2px;background:var(--border);transform:translateY(-50%)}
.replay-progress{position:absolute;top:0;left:0;height:100%;background:var(--purple);border-radius:1px;transition:width .3s}
.replay-handle{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--purple);transform:translate(-50%,-50%);box-shadow:0 0 8px var(--purple);transition:left .3s}
.replay-marker{position:absolute;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;cursor:pointer;z-index:2}
.replay-marker:hover{transform:translate(-50%,-50%) scale(1.4)}
.replay-marker-label{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--t3);white-space:nowrap;pointer-events:none}
.replay-time-display{position:absolute;bottom:4px;left:12px;font-size:11px;color:var(--t2);font-family:'Cascadia Code',monospace}
.builder-palette{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.palette-item{background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;cursor:grab;font-size:12px;display:flex;align-items:center;gap:6px;transition:all .2s;user-select:none}
.palette-item:hover{border-color:var(--cyan);background:rgba(0,212,255,.05)}
.palette-item.dragging{opacity:.4;cursor:grabbing}
.palette-icon{font-size:16px}
.builder-canvas{background:var(--bg);border:2px dashed var(--border);border-radius:8px;min-height:200px;position:relative;overflow:hidden}
.builder-canvas.drag-over{border-color:var(--cyan);background:rgba(0,212,255,.03)}
.placed-item{position:absolute;background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;cursor:move;display:flex;align-items:center;gap:6px;z-index:10}
.placed-item.selected{border-color:var(--cyan);box-shadow:0 0 8px rgba(0,212,255,.3)}
.placed-item .pi-del{cursor:pointer;color:var(--red);font-size:14px;margin-left:4px}
.builder-info{font-size:11px;color:var(--t3);margin-top:8px;text-align:center}
.chat-toggle{position:absolute;bottom:16px;right:16px;width:48px;height:48px;border-radius:50%;background:var(--blue);border:none;color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 16px rgba(0,153,255,.4);z-index:600;transition:transform .2s}
.chat-toggle:hover{transform:scale(1.1)}
.chat-panel{position:absolute;bottom:72px;right:16px;width:360px;height:420px;background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;z-index:600;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.chat-panel.hidden{display:none}
.chat-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.chat-body{flex:1;overflow-y:auto;padding:10px}
.chat-body::-webkit-scrollbar{width:4px}.chat-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.chat-msg{margin-bottom:10px;max-width:85%}
.chat-msg.agent{margin-right:auto}.chat-msg.user{margin-left:auto;text-align:right}
.chat-bubble{display:inline-block;padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.5}
.chat-msg.agent .chat-bubble{background:var(--card2);border:1px solid var(--border)}
.chat-msg.user .chat-bubble{background:var(--blue);color:#fff}
.chat-suggestions{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-top:1px solid var(--border)}
.chat-suggestion{padding:4px 10px;background:var(--card2);border:1px solid var(--border);border-radius:12px;font-size:11px;cursor:pointer;transition:all .2s}
.chat-suggestion:hover{border-color:var(--blue);color:var(--cyan)}
.chat-input-row{display:flex;padding:8px;border-top:1px solid var(--border);gap:6px}
.chat-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--t1);font-size:13px;font-family:inherit}
.chat-input:focus{outline:none;border-color:var(--blue)}
.chat-send{padding:6px 12px;background:var(--blue);border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:13px}
.toast-container{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(8px);box-shadow:0 4px 16px rgba(0,0,0,.4);animation:ti .3s}
@keyframes ti{from{opacity:0;transform:translateY(-10px)}}
.toast-icon{font-size:16px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9998;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;width:680px;max-height:80vh;display:flex;flex-direction:column}
.modal-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.modal-title{font-size:15px;font-weight:600;flex:1}
.modal-close{background:none;border:none;color:var(--t2);font-size:20px;cursor:pointer}
.modal-body{flex:1;overflow-y:auto;padding:18px}
.modal-footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.ad-react-step{display:flex;gap:8px;margin:6px 0;padding:6px;background:var(--bg);border-radius:6px}
.ad-react-icon{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.ad-react-icon.obs{background:rgba(0,212,255,.2);color:var(--cyan)}
.ad-react-icon.think{background:rgba(176,96,255,.2);color:var(--purple)}
.ad-react-icon.act{background:rgba(0,230,118,.2);color:var(--green)}
.wf-step{display:flex;gap:10px;margin:8px 0}
.wf-dot{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.wf-dot.cyan{background:rgba(0,212,255,.15);color:var(--cyan)}
.wf-dot.purple{background:rgba(176,96,255,.15);color:var(--purple)}
.wf-dot.orange{background:rgba(255,136,0,.15);color:var(--orange)}
.wf-dot.green{background:rgba(0,230,118,.15);color:var(--green)}
.wf-dot.yellow{background:rgba(255,200,0,.15);color:var(--yellow)}
.wf-content{flex:1}.wf-title{font-size:13px;font-weight:600}.wf-desc{font-size:12px;color:var(--t2);margin-top:2px}
.wf-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.wf-meta span{font-size:10px;padding:1px 6px;border-radius:3px;background:var(--bg);color:var(--t3)}
.rr-section{margin-bottom:18px}
.rr-section-title{font-size:14px;font-weight:600;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.dim-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.dim-card{background:var(--bg);border-radius:8px;padding:12px;text-align:center}
.dim-card .dc-title{font-size:11px;color:var(--t2)}
.dim-card .dc-val{font-size:18px;font-weight:700;margin:4px 0}
.dim-card .dc-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.dim-card .dc-bar-fill{height:100%;border-radius:2px}
.rr-metric-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(42,53,72,.5)}
.rr-metric-label{flex:1;font-size:12px;color:var(--t2)}
.rr-metric-bar{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.rr-metric-fill{height:100%;border-radius:3px}
.rr-metric-val{font-size:13px;font-weight:600;min-width:60px;text-align:right}
.rr-timeline-node{display:flex;gap:10px;margin:8px 0}
.rr-tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.rr-tl-content{flex:1}
.rr-tl-time{font-size:11px;color:var(--t3);font-family:'Cascadia Code',monospace}
.rr-tl-title{font-size:13px;font-weight:600}
.rr-tl-desc{font-size:12px;color:var(--t2)}
.info-banner{background:rgba(0,153,255,.08);border:1px solid rgba(0,153,255,.2);border-radius:6px;padding:8px 12px;font-size:12px;color:var(--t2);margin-bottom:8px}
.warn-banner{background:rgba(255,200,0,.08);border:1px solid rgba(255,200,0,.2);border-radius:6px;padding:8px 12px;font-size:12px;color:var(--yellow);margin:8px 0}
.demo-progress{position:absolute;top:0;left:0;right:0;height:3px;z-index:999;display:none}
.demo-progress.show{display:block}
.demo-progress-fill{height:100%;width:0%;transition:width .3s}
#three-tooltip{position:absolute;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--t1);pointer-events:none;z-index:50;display:none;white-space:nowrap}
</style>
</head>
<body>
<div class="header">
  <div class="logo"><div class="logo-icon">🛡️</div><div class="logo-text">海外园区应急演练智能体平台<span class="sub">Overseas Park Emergency Drill Platform</span></div></div>
  <div class="nav-bar" id="nav-bar">
    <div class="nav-item active" data-tab="config" onclick="switchTab('config')"><span class="nav-idx">01</span>场景配置</div>
    <div class="nav-item" data-tab="scene" onclick="switchTab('scene')"><span class="nav-idx">02</span>态势感知</div>
    <div class="nav-item" data-tab="drill" onclick="switchTab('drill')"><span class="nav-idx">03</span>演练推演</div>
    <div class="nav-item" data-tab="command" onclick="switchTab('command')"><span class="nav-idx">04</span>演练指挥</div>
    <div class="nav-item" data-tab="review" onclick="switchTab('review')"><span class="nav-idx">05</span>演练复盘</div>
  </div>
  <div class="top-right">
    <div class="stat-item"><span class="dot-on"></span><span>智能体</span><span class="stat-val">20</span><span>部署</span></div>
    <div class="stat-item"><span>区域</span><span class="stat-val">5</span></div>
    <div class="stat-item"><span id="clock">--:--:--</span></div>
  </div>
</div>
<div class="main">
  <div class="map-area">
    <div id="map"></div>
    <div id="three-container"></div>
    <div id="three-tooltip"></div>
    <div class="map-tools">
      <button class="map-btn active" onclick="setMapView('overview',event)">全景</button>
      <button class="map-btn" onclick="setMapView('risk',event)">风险</button>
      <button class="map-btn" onclick="setMapView('route',event)">路线</button>
      <button class="map-btn" onclick="setMapView('zone',event)">分区</button>
      <button class="map-btn" onclick="toggle3D()">3D场景</button>
    </div>
    <div class="map-legend">
      <div class="legend-title">图例</div>
      <div class="legend-row"><div class="legend-color" style="background:#ff3d3d"></div><span>紧急事件</span></div>
      <div class="legend-row"><div class="legend-color" style="background:#ff8800"></div><span>重要告警</span></div>
      <div class="legend-row"><div class="legend-color" style="background:#00d4ff"></div><span>监控设备</span></div>
      <div class="legend-row"><div class="legend-color" style="background:#00e676"></div><span>人员/车辆</span></div>
    </div>
    <button class="chat-toggle" onclick="toggleChat()">💬</button>
    <div class="chat-panel hidden" id="chat-panel">
      <div class="chat-header"><span style="font-size:16px">🤖</span><span style="font-size:13px;font-weight:600">演练智能助手</span><span style="margin-left:auto;cursor:pointer;color:var(--t2)" onclick="toggleChat()">✕</span></div>
      <div class="chat-body" id="chat-body"></div>
      <div class="chat-suggestions" id="chat-suggestions"></div>
      <div class="chat-input-row"><input type="text" class="chat-input" id="chat-input" placeholder="输入问题..." onkeypress="if(event.key==='Enter')sendChat()"><button class="chat-send" onclick="sendChat()">发送</button></div>

// === MAP ===
function initMap(){
  map=L.map('map',{zoomControl:false,attributionControl:false}).setView(PARK_CENTER,14);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',{subdomains:['a','b','c','d'],maxZoom:19}).addTo(map);
  L.control.zoom({position:'topleft'}).addTo(map);
  eventLayer=L.layerGroup().addTo(map);
  cameraLayer=L.layerGroup().addTo(map);
  routeLayer=L.layerGroup().addTo(map);
  zoneLayer=L.layerGroup().addTo(map);
  personnelLayer=L.layerGroup().addTo(map);
  drawParkMarkers();
}
function drawParkMarkers(){
  eventLayer.clearLayers();cameraLayer.clearLayers();routeLayer.clearLayers();zoneLayer.clearLayers();personnelLayer.clearLayers();
  parkMarkers.buildings.forEach(b=>{
    let iconHtml='',iconClass='';
    const typeMap={office:['🏢','rgba(0,153,255,0.2)'],production:['🏭','rgba(255,136,0,0.2)'],warehouse:['🏪','rgba(0,191,165,0.2)'],living:['🏠','rgba(0,230,118,0.2)'],gate:['🚪','rgba(255,200,0,0.2)'],fence:['🚧','rgba(255,61,61,0.2)'],medical:['🏥','rgba(0,230,118,0.2)']};
    const tm=typeMap[b.type]||['🏢','rgba(0,153,255,0.2)'];
    L.marker(b.coords,{icon:L.divIcon({className:'',html:`<div style="font-size:20px;text-shadow:0 0 4px rgba(0,0,0,.8)">${tm[0]}</div>`,iconSize:[24,24],iconAnchor:[12,12]})}).addTo(zoneLayer).bindPopup(`<b>${b.name}</b>`);
  });
  parkMarkers.cameras.forEach(c=>{
    L.marker(c.coords,{icon:L.divIcon({className:'',html:`<div style="width:10px;height:10px;border-radius:50%;background:#00d4ff;border:1px solid #fff;box-shadow:0 0 4px #00d4ff"></div>`,iconSize:[12,12],iconAnchor:[6,6]})}).addTo(cameraLayer).bindPopup(`<b>${c.name}</b>`);
  });
  const evt=activeEvents[currentScenario];
  if(evt){
    L.marker(evt.coords,{icon:L.divIcon({className:'',html:`<div style="width:14px;height:14px;border-radius:50%;background:#ff3d3d;border:2px solid #ff3d3d;animation:pm 2s infinite;box-shadow:0 0 10px #ff3d3d"></div>`,iconSize:[18,18],iconAnchor:[9,9]})}).addTo(eventLayer).bindPopup(`<b>${evt.title}</b><br>${evt.loc}<br>${evt.time}<br>${evt.severity}`);
  }
}

}

function init3D(){
  const container=document.getElementById('three-container');
  threeScene=new THREE.Scene();

  threeScene.fog=new THREE.Fog(0x0a0e14,80,200);
  const w=container.clientWidth||800,h=container.clientHeight||600;
  threeCamera=new THREE.PerspectiveCamera(60,w/h,0.1,1000);
  threeCamera.position.set(60,50,60);
  threeCamera.lookAt(0,0,0);
  threeRenderer=new THREE.WebGLRenderer({antialias:true});
  threeRenderer.setSize(w,h);
  threeRenderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(threeRenderer.domElement);
  // Lights
  threeScene.add(new THREE.AmbientLight(0x404060,0.6));
  const dl=new THREE.DirectionalLight(0xffffff,0.8);
  dl.position.set(50,80,50);
  threeScene.add(dl);
  // Ground
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshPhongMaterial({color:0x1a2030}));
  ground.rotation.x=-Math.PI/2;
  threeScene.add(ground);
  // Grid
  const grid=new THREE.GridHelper(200,40,0x2a3548,0x1a2030);
  grid.position.y=0.1;
  threeScene.add(grid);
  // Buildings
  const bldData=[{name:'A区办公楼',x:-15,z:-10,w:12,d:8,h:10,c:0x0099ff},{name:'B区生产区',x:-5,z:15,w:14,d:10,h:8,c:0xff8800},{name:'C区仓储区',x:15,z:10,w:10,d:12,h:6,c:0x00bfa5},{name:'生活区',x:20,z:-15,w:8,d:8,h:7,c:0x00e676},{name:'医务室',x:-2,z:-2,w:4,d:4,h:4,c:0x00e676}];
  bldData.forEach(b=>{
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(b.w,b.h,b.d),new THREE.MeshPhongMaterial({color:b.c,transparent:true,opacity:0.7}));
    mesh.position.set(b.x,b.h/2,b.z);
    mesh.userData={name:b.name,type:'building'};
    threeScene.add(mesh);
    threeMeshes.push(mesh);
    const edges=new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry),new THREE.LineBasicMaterial({color:b.c}));
    edges.position.copy(mesh.position);
    threeScene.add(edges);
  });
  // Fence
  const fp=[[-40,-30],[40,-30],[40,30],[-40,30]];
  const flp=fp.map(p=>new THREE.Vector3(p[0],3,p[1])).concat([new THREE.Vector3(fp[0][0],3,fp[0][1])]);
  const fence=new THREE.Line(new THREE.BufferGeometry().setFromPoints(flp),new THREE.LineBasicMaterial({color:0xff8800,opacity:0.5,transparent:true}));
  threeScene.add(fence);
  // Event marker
  const eMarker=new THREE.Mesh(new THREE.ConeGeometry(2,6,8),new THREE.MeshPhongMaterial({color:0xff3d3d,emissive:0x660000}));
  eMarker.position.set(35,8,-20);
  eMarker.userData={name:'事件标记',type:'event'};
  threeScene.add(eMarker);
  threeMeshes.push(eMarker);
  // Cameras
  for(let i=0;i<4;i++){
    const cm=new THREE.Mesh(new THREE.SphereGeometry(0.8,8,6),new THREE.MeshPhongMaterial({color:0x00d4ff,emissive:0x003344}));
    const ang=i*Math.PI/2;
    cm.position.set(Math.cos(ang)*38,5,Math.sin(ang)*28);
    cm.userData={name:'CAM-'+i,type:'camera'};
    threeScene.add(cm);
    threeMeshes.push(cm);
  }
  // Mouse controls
  let isDragging=false,prevX=0,prevY=0;
  const dom=threeRenderer.domElement;
  dom.addEventListener('mousedown',e=>{isDragging=true;prevX=e.clientX;prevY=e.clientY;});
  dom.addEventListener('mouseup',()=>isDragging=false);
  dom.addEventListener('mousemove',e=>{
    if(!isDragging)return;
    const dx=e.clientX-prevX,dy=e.clientY-prevY;
    const sph=THREE.Spherical().setFromVector3(threeCamera.position);
    sph.theta-=dx*0.01;sph.phi=Math.max(0.1,Math.min(Math.PI-0.1,sph.phi-dy*0.01));
    threeCamera.position.setFromSpherical(sph);
    threeCamera.lookAt(0,0,0);
    prevX=e.clientX;prevY=e.clientY;
  });
  dom.addEventListener('wheel',e=>{
    e.preventDefault();
    const d=threeCamera.position.distanceTo(new THREE.Vector3(0,0,0));
    const nd=Math.max(20,Math.min(150,d+e.deltaY*0.1));
    threeCamera.position.normalize().multiplyScalar(nd);
    threeCamera.lookAt(0,0,0);
  });
  // Click pick
  const raycaster=new THREE.Raycaster();
  const mouse=new THREE.Vector2();
  dom.addEventListener('click',e=>{
    const rect=dom.getBoundingClientRect();
    mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
    mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(mouse,threeCamera);
    const hits=raycaster.intersectObjects(threeMeshes);
    if(hits.length>0){
      const obj=hits[0].object;
      const tip=document.getElementById('three-tooltip');
      tip.textContent=obj.userData.name||'';
      tip.style.left=(e.clientX-rect.left+10)+'px';
      tip.style.top=(e.clientY-rect.top+10)+'px';
      tip.style.display='block';
      setTimeout(()=>tip.style.display='none',3000);
    }
  });
  animate3D();
}
function animate3D(){
  requestAnimationFrame(animate3D);
  if(threeRenderer&&is3DMode)threeRenderer.render(threeScene,threeCamera);
}
function toggle3D(){
  const c=document.getElementById('three-container');
  is3DMode=!is3DMode;
  if(is3DMode){
    c.classList.add('show');
    if(!threeScene)init3D();
    else{const w=c.clientWidth,h=c.clientHeight;threeCamera.aspect=w/h;threeCamera.updateProjectionMatrix();threeRenderer.setSize(w,h);}
    showToast('🌐','3D场景已开启','拖拽旋转/滚轮缩放/点击拾取');
  }else{
    c.classList.remove('show');
    showToast('🗺️','2D地图已切换','返回地图视图');
  }
}

// === REPLAY ===
function seekReplay(idx){
  const markers=scenarioReplayMarkers[currentScenario];
  replayPos=Math.max(0,Math.min(markers.length-1,idx));
  updateReplayUI();
}
function seekReplayByPos(e){
  const tl=document.getElementById('replay-timeline');
  if(!tl)return;
  const rect=tl.getBoundingClientRect();
  const pct=(e.clientX-rect.left)/rect.width;
  const markers=scenarioReplayMarkers[currentScenario];
  const idx=Math.round(pct*(markers.length-1));
  seekReplay(idx);
}
function toggleReplay(){
  replayPlaying=!replayPlaying;
  const btn=document.getElementById('replay-play-btn');
  if(btn)btn.textContent=replayPlaying?'⏸ 暂停':'▶ 播放';
  if(replayPlaying){
    const markers=scenarioReplayMarkers[currentScenario];
    replayTimer=setInterval(()=>{
      if(replayPos>=markers.length-1){
        replayPlaying=false;
        if(btn)btn.textContent='▶ 播放';
        clearInterval(replayTimer);
        return;
      }
      replayPos++;updateReplayUI();
    },1500);
  }else{
    clearInterval(replayTimer);
  }
}
function updateReplayUI(){
  const markers=scenarioReplayMarkers[currentScenario];
  if(!markers||markers.length===0)return;
  const m=markers[replayPos];
  const pct=(replayPos/(markers.length-1))*100;
  const prog=document.getElementById('replay-progress');
  const handle=document.getElementById('replay-handle');
  const disp=document.getElementById('replay-time-display');
  const evt=document.getElementById('replay-current-event');
  if(prog)prog.style.width=pct+'%';
  if(handle)handle.style.left=pct+'%';
  if(disp)disp.textContent=`${m.time} / ${markers[markers.length-1].time}`;
  if(evt)evt.innerHTML=`<span class="tag purple">${m.time}</span> <span style="color:var(--t1);margin-left:8px">${m.desc}</span>`;
}

// === AGENT DETAIL ===
function openAgentDetail(name){
  const a=agentDetails[name];
  if(!a)return;
  document.getElementById('agent-detail-title').innerHTML=`${a.icon} ${name}`;
  let body='';
  body+=`<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><span class="tag ${a.color}">${a.status}</span><span class="tag">运行 ${a.uptime}</span><span class="tag">调用 ${a.calls}次</span><span class="tag green">${a.errors}错误</span></div>`;
  body+=`<div style="margin-bottom:16px;font-size:13px;color:var(--t2);line-height:1.6">${a.desc}</div>`;
  body+=`<div style="margin-bottom:16px"><div style="font-size:13px;font-weight:600;margin-bottom:8px">核心能力</div>`;
  a.capabilities.forEach(c=>body+=`<span class="tag ${a.color}" style="margin:2px">${c}</span>`);
  body+='</div>';
  body+=`<div style="margin-bottom:16px"><div style="font-size:13px;font-weight:600;margin-bottom:8px">ReAct 推理轨迹</div>`;
  const typeMap={observation:{cls:'obs',label:'O'},thought:{cls:'think',label:'T'},action:{cls:'act',label:'A'}};
  a.react.forEach(r=>{
    const tm=typeMap[r.type]||{cls:'obs',label:'O'};
    body+=`<div class="ad-react-step"><div class="ad-react-icon ${tm.cls}">${tm.label}</div><div><div style="font-size:12px;font-weight:600">${r.title}</div><div style="font-size:12px;color:var(--t2)">${r.text}</div><div style="font-size:10px;color:var(--t3);margin-top:2px">${r.time}</div></div></div>`;
  });
  body+='</div>';
  if(agentWorkflows[name]){
    body+=`<div><div style="font-size:13px;font-weight:600;margin-bottom:8px">工作流程</div>`;
    agentWorkflows[name].steps.forEach((s,i)=>{
      body+=`<div class="wf-step"><div class="wf-dot ${s.dot}">${i+1}</div><div class="wf-content"><div class="wf-title">${s.title}</div><div class="wf-desc">${s.desc}</div><div class="wf-meta">`;
      (s.meta||[]).forEach(m=>body+=`<span>${m}</span>`);
      body+='</div></div></div>';
    });
    body+='</div>';
  }
  document.getElementById('agent-detail-body').innerHTML=body;
  document.getElementById('agent-detail-overlay').classList.add('show');
}

// === SCENARIO ===
function selectScenario(key){
  currentScenario=key;
  drawParkMarkers();
  const sc=scenarios[key];
  if(sc&&map)map.flyTo(sc.location,15,{duration:1});
  showToast(sc.icon,`场景切换: ${sc.name}`,sc.desc);
  if(currentTab==='config')renderConfigPanel();
  else if(currentTab==='scene')renderScenePanel();
  else if(currentTab==='drill')renderDrillPanel();
  else if(currentTab==='command')renderCommandPanel();
  else if(currentTab==='review')renderReviewPanel();
}

// === BUILDER (drag-drop) ===
function onPaletteDragStart(e,idx){
  e.dataTransfer.setData('text/plain',idx);
  e.target.classList.add('dragging');
}
function onCanvasDragOver(e){
  e.preventDefault();
  document.getElementById('builder-canvas').classList.add('drag-over');
}
function onCanvasDragLeave(){
  document.getElementById('builder-canvas').classList.remove('drag-over');
}
function onCanvasDrop(e){
  e.preventDefault();
  document.getElementById('builder-canvas').classList.remove('drag-over');
  const idx=parseInt(e.dataTransfer.getData('text/plain'));
  const p=paletteItems[idx];
  if(!p)return;
  const canvas=document.getElementById('builder-canvas');
  const rect=canvas.getBoundingClientRect();
  placedItems.push({type:p.type,icon:p.icon,label:p.label,x:e.clientX-rect.left-40,y:e.clientY-rect.top-15});
  renderConfigPanel();
}
function selectPlaced(idx){
  selectedPlacedIdx=idx;
  renderConfigPanel();
}
function delPlaced(idx){
  placedItems.splice(idx,1);
  selectedPlacedIdx=-1;
  renderConfigPanel();
}
function startDragPlaced(e,idx){
  e.preventDefault();
  selectedPlacedIdx=idx;
  const canvas=document.getElementById('builder-canvas');
  if(!canvas)return;
  const rect=canvas.getBoundingClientRect();
  const item=placedItems[idx];
  const startX=e.clientX,startY=e.clientY;
  const origX=item.x,origY=item.y;
  const onMove=ev=>{
    item.x=Math.max(0,Math.min(rect.width-80,origX+ev.clientX-startX));
    item.y=Math.max(0,Math.min(rect.height-30,origY+ev.clientY-startY));
    const el=canvas.querySelector(`.placed-item:nth-child(${idx+1})`);
    // Just re-render for simplicity
  };
  const onUp=()=>{
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    renderConfigPanel();
  };
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

    {type:'building',icon:'🏭',label:'B区生产区',x:150,y:80},

function clearScene(){

function applyConfig(){

}

// === DEDUCTION ===
function startDeduction(){
  showToast('🔮','推演启动','正在运行推演模型...');
  setTimeout(()=>{
    const ded=scenarioDeduction[currentScenario];
    const r0=ded.results[0]?`${ded.results[0].title}: ${ded.results[0].val}`:'';
    const r1=ded.results[1]?`${ded.results[1].title}: ${ded.results[1].val}`:'';
    showToast('✅','推演完成',`${r0} / ${r1}`);
  },2000);
}

// === REVIEW REPORT ===
function generateReviewReport(){
  const rv=scenarioReview[currentScenario];
  const sc=scenarios[currentScenario];
  const markers=scenarioReplayMarkers[currentScenario];
  const totalMin=markers.length>0?markers[markers.length-1].time.split(':')[0]:'7';
  const score=Math.round(rv.metrics.reduce((s,m)=>s+m.pct,0)/rv.metrics.length);
  let h='';
  h+=`<div class="rr-section"><div class="rr-section-title">事件概览</div><div class="dim-grid"><div class="dim-card"><div class="dc-title">演练场景</div><div class="dc-val" style="color:var(--red)">${sc.name}</div></div><div class="dim-card"><div class="dc-title">演练时长</div><div class="dc-val" style="color:var(--cyan)">${totalMin}分钟</div></div><div class="dim-card"><div class="dc-title">智能体</div><div class="dc-val" style="color:var(--green)">${sc.agents.length}个</div></div><div class="dim-card"><div class="dc-title">综合评分</div><div class="dc-val" style="color:var(--yellow)">${score}分</div></div></div></div>`;
  h+='<div class="rr-section"><div class="rr-section-title">处置效果评估</div>';
  rv.metrics.forEach(m=>{
    h+=`<div class="rr-metric-row"><div class="rr-metric-label">${m.title}（目标: ${m.target}）</div><div class="rr-metric-bar"><div class="rr-metric-fill" style="width:${m.pct}%;background:var(--${m.color})"></div></div><div class="rr-metric-val" style="color:var(--${m.color})">${m.val}</div></div>`;
  });
  h+='</div>';
  h+='<div class="rr-section"><div class="rr-section-title">处置时间线</div>';
  const colorMap={cyan:'var(--cyan)',purple:'var(--purple)',orange:'var(--orange)',green:'var(--green)',yellow:'var(--yellow)'};
  rv.timeline.forEach(t=>{
    h+=`<div class="rr-timeline-node"><div class="rr-tl-dot" style="background:${colorMap[t.color]||'var(--cyan)'}"></div><div class="rr-tl-content"><div class="rr-tl-time">${t.time} · ${t.phase}</div><div class="rr-tl-title">${t.title}</div><div class="rr-tl-desc">${t.desc}</div></div></div>`;
  });
  h+='</div>';
  h+='<div class="rr-section"><div class="rr-section-title">经验教训与改进建议</div>';
  rv.lessons.forEach(l=>{
    h+=`<div style="padding:8px 0;border-bottom:1px solid var(--border)"><div style="font-size:13px;color:var(--t1)">${l.text}</div><div style="font-size:12px;color:var(--t2);margin-top:4px">建议: ${l.suggestion}</div><span class="tag orange" style="margin-top:4px">${l.action}</span></div>`;
  });
  h+='</div>';
  h+=`<div class="rr-section"><div class="rr-section-title">智能体运行统计</div>`;
  sc.agents.forEach(name=>{
    const a=agentDetails[name];
    if(a)h+=`<div class="fp-row"><span class="label">${a.icon} ${name}</span><span class="tag">${a.calls}次</span><span class="tag green">${a.errors}错误</span></div>`;
  });
  h+='</div>';
  h+='<div class="warn-banner">本报告为演练复盘，非真实事件处置记录。数据仅供演练评估和改进参考。</div>';
  document.getElementById('review-report-body').innerHTML=h;
  document.getElementById('review-report-overlay').classList.add('show');
}

// === CHAT ===
function toggleChat(){
  chatOpen=!chatOpen;
  document.getElementById('chat-panel').classList.toggle('hidden',!chatOpen);
  if(chatOpen){
    const body=document.getElementById('chat-body');
    if(body.children.length===0){
      addChatMsg('演练智能助手已就绪。可询问入侵、医疗、撤离、火灾、避险、推演、回放等话题。','agent');
    }
    updateChatSuggestions();
  }
}
function updateChatSuggestions(){
  const el=document.getElementById('chat-suggestions');
  if(!el)return;
  const sugg={config:['不明人员入侵','紧急医疗转运','全员撤离','火灾突发事件','营地避险'],scene:['当前态势','推演分析','回放过程'],drill:['启动推演','查看结果'],command:['指挥调度','部门协同'],review:['复盘报告','经验教训','回放过程']};
  const list=sugg[currentTab]||['不明人员入侵','推演分析','回放过程'];
  el.innerHTML=list.map(s=>`<div class="chat-suggestion" onclick="document.getElementById('chat-input').value='${s}';sendChat()">${s}</div>`).join('');
}
function addChatMsg(text,sender,extra){
  const body=document.getElementById('chat-body');
  const div=document.createElement('div');
  div.className='chat-msg '+sender;
  let html=`<div class="chat-bubble">${text}</div>`;
  if(extra)html+=extra;
  div.innerHTML=html;
  body.appendChild(div);
  body.scrollTop=body.scrollHeight;
}
function sendChat(){
  const input=document.getElementById('chat-input');
  const text=input.value.trim();
  if(!text)return;
  addChatMsg(text,'user');
  input.value='';
  const body=document.getElementById('chat-body');
  const typing=document.createElement('div');
  typing.className='chat-msg agent';
  typing.innerHTML='<div class="chat-bubble" style="color:var(--t2)">思考中...</div>';
  body.appendChild(typing);
  body.scrollTop=body.scrollHeight;
  setTimeout(()=>{
    body.removeChild(typing);
    const cmd=matchChat(text);
    if(cmd){
      const replyText=typeof cmd.reply==='function'?cmd.reply():cmd.reply;
      const thinkArr=typeof cmd.think==='function'?cmd.think():(cmd.think||[]);
      let extra='';
      if(thinkArr.length>0){
        extra+='<div style="margin-top:8px;border:1px solid var(--border);border-radius:6px;overflow:hidden"><div style="padding:6px 10px;font-size:11px;color:var(--t2);cursor:pointer" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'none\'?\'block\':\'none\'">💭 推理过程 ('+thinkArr.length+'步)</div><div style="padding:8px 10px;display:none;border-top:1px solid var(--border)">';
        thinkArr.forEach(s=>{
          const icons={o:'O',t:'T',a:'A'};
          const cls=s.type==='o'?'obs':s.type==='t'?'think':'act';
          extra+=`<div style="display:flex;gap:8px;margin:4px 0;font-size:12px"><div class="ad-react-icon ${cls}" style="width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">${icons[s.type]||'O'}</div><div><b>${s.title}</b>: ${s.text}</div></div>`;
        });
        extra+='</div></div>';
      }
      addChatMsg(replyText,'agent',extra);
      if(cmd.action)setTimeout(cmd.action,600);
    }else{
      addChatMsg('未找到匹配的演练场景。可试试：入侵、医疗、撤离、火灾、避险、推演、回放。','agent');
    }
  },800);
}
function matchChat(t){
  if(t.includes('入侵')||t.includes('侵扰')||t.includes('不明人员'))return chatCommands['入侵'];
  if(t.includes('医疗')||t.includes('转运')||t.includes('心脏'))return chatCommands['医疗'];
  if(t.includes('撤离')||t.includes('疏散'))return chatCommands['撤离'];
  if(t.includes('火灾')||t.includes('着火')||t.includes('消防'))return chatCommands['火灾'];
  if(t.includes('避险')||t.includes('沙尘')||t.includes('营地'))return chatCommands['避险'];
  if(t.includes('推演')||t.includes('演练')||t.includes('模拟'))return chatCommands['推演'];
  if(t.includes('回放')||t.includes('回顾')||t.includes('复盘'))return chatCommands['回放'];
  return null;
}

// === DEMO MODE ===
function startDrillDemo(){
  if(demoRunning)return;
  demoRunning=true;
  const phases=[
    {phase:'config',label:'场景配置 - 搭建场景',duration:4000,color:'cyan',actions:[
      ()=>{switchTab('config');showToast('🏗️','场景配置','选择场景+搭建3D环境');},
    ]},
    {phase:'scene',label:'态势感知 - 事件触发',duration:5000,color:'cyan',actions:[
      ()=>{switchTab('scene');showToast('🚨','态势感知',`${scenarios[currentScenario].name}事件触发`);},
      ()=>{if(!chatOpen)toggleChat();sendChatDemo(scenarios[currentScenario].name);},
    ]},
    {phase:'drill',label:'演练推演 - 模型计算',duration:6000,color:'orange',actions:[
      ()=>{switchTab('drill');showToast('🔮','推演启动','态势推演进行中...');},
      ()=>{
        const ded=scenarioDeduction[currentScenario];
        const r0=ded.results[0]?`${ded.results[0].title}: ${ded.results[0].val}`:'';
        const r1=ded.results[1]?`${ded.results[1].title}: ${ded.results[1].val}`:'';
        showToast('✅','推演完成',`${r0} / ${r1}`);
      },
    ]},
    {phase:'command',label:'演练指挥 - 调度执行',duration:5000,color:'red',actions:[
      ()=>{switchTab('command');showToast('🎖️','指挥调度','多部门协同+智能体调度');},
    ]},
    {phase:'review',label:'演练复盘 - 评估报告',duration:6000,color:'yellow',actions:[
      ()=>{
        switchTab('review');
        const rv=scenarioReview[currentScenario];
        const score=Math.round(rv.metrics.reduce((s,m)=>s+m.pct,0)/rv.metrics.length);
        showToast('📝','复盘完成',`综合评分${score}分`);
      },
      ()=>{generateReviewReport();},
    ]},
  ];
  let cumulative=0;
  const total=phases.reduce((s,p)=>s+p.duration,0);
  document.getElementById('demo-progress').classList.add('show');
  phases.forEach(p=>{
    p.actions.forEach((a,ai)=>{
      const delay=cumulative+(p.duration/p.actions.length)*ai;
      demoTimers.push(setTimeout(a,delay));
    });
    demoTimers.push(setTimeout(()=>{
      document.getElementById('demo-progress-fill').style.width=((cumulative+p.duration)/total*100)+'%';
      document.getElementById('demo-progress-fill').style.background=`var(--${p.color})`;
    },cumulative));
    cumulative+=p.duration;
  });
  demoTimers.push(setTimeout(()=>{
    demoRunning=false;
    document.getElementById('demo-progress').classList.remove('show');
    showToast('✅','演示完成','端到端演练流程演示完毕');
  },cumulative+500));
}
function sendChatDemo(text){
  document.getElementById('chat-input').value=text;
  sendChat();
}

// === TOAST ===
function showToast(icon,title,desc){
  const c=document.getElementById('toast-container');
  const t=document.createElement('div');
  t.className='toast';
  t.innerHTML=`<span class="toast-icon">${icon}</span><div><div style="font-weight:600;font-size:13px">${title}</div><div style="font-size:11px;color:var(--t2)">${desc}</div></div>`;
  c.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},3000);
}

// === CLOCK ===
function updateClock(){
  const d=new Date();
  document.getElementById('clock').textContent=d.toLocaleTimeString('zh-CN',{hour12:false});
}

// === INIT ===
window.addEventListener('load',()=>{
  initMap();

});

    threeCamera.aspect=c.clientWidth/c.clientHeight;
    threeCamera.updateProjectionMatrix();

});
