function renderPlanPanel(panel,pc){
  panel.className='func-panel'+(panelCollapsed?' collapsed':'');
  let h='';
  h+=`<div class="fp-section">`;
  h+=`<div class="fp-title" style="color:var(--green)"><span class="fp-icon">&#128220;</span>应急预案库</div>`;
  h+=`<div class="fp-desc">基于知识图谱的预案智能匹配与检索，当前已匹配<b style="color:var(--red)">3</b>份预案，建议启动III级响应</div>`;
  // AI生成预案入口
  h+=`<div style="background:linear-gradient(135deg,rgba(176,96,255,0.08),rgba(0,230,118,0.08));border:1px solid rgba(176,96,255,0.25);border-radius:6px;padding:10px;margin-bottom:10px">`;
  h+=`<div style="display:flex;justify-content:space-between;align-items:center">`;
  h+=`<div><div style="font-size:11px;font-weight:700;color:var(--purple)">&#10024; AI智能生成预案</div>`;
  h+=`<div style="font-size:9px;color:var(--t2);margin-top:2px">基于当前态势自动生成专项预案，供专家审核确认后生效</div></div>`;
  h+=`<button class="fp-btn fp-btn-primary" onclick="generateAIPlan()" style="white-space:nowrap">&#9889; 生成预案</button>`;
  h+=`</div></div>`;
  // 搜索与筛选
  h+=`<div style="display:flex;gap:6px;margin-bottom:8px">`;
  h+=`<input class="fp-input" placeholder="搜索预案名称/条款..." value="${planSearch}" oninput="planSearch=this.value;renderPlanPanel(document.getElementById('right-panel'),document.getElementById('panel-content'))" style="flex:1"/>`;
  h+=`</div>`;
  h+=`<div style="display:flex;gap:3px;margin-bottom:8px;flex-wrap:wrap">`;
  ['all','防汛','地质','内涝','水库','转移','综合'].forEach(t=>{
    const active=planActive===t;
    h+=`<button class="tab-btn ${active?'active':''}" style="${active?'border-color:var(--green);color:var(--green);background:rgba(0,230,118,0.1)':''}" onclick="planActive='${t}';renderPlanPanel(document.getElementById('right-panel'),document.getElementById('panel-content'))">${t==='all'?'全部':t}</button>`;
  });
  h+=`</div></div>`;
  // 预案列表（含文件框按钮）
  h+=`<div class="fp-section">`;
  h+=`<div class="fp-title" style="color:var(--green);font-size:12px">&#128203; 匹配预案（按相关度排序）</div>`;
  const filtered=planList.filter(p=>{
    if(planActive!=='all'&&p.type!==planActive)return false;
    if(planSearch&&!p.name.includes(planSearch)&&!p.desc.includes(planSearch))return false;
    return true;
  });
  filtered.forEach(p=>{
    h+=`<div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:6px;cursor:pointer" onclick="openPlanDetail(${p.id})" onmouseover="this.style.borderColor='var(--cyan)'" onmouseout="this.style.borderColor='var(--border)'">`;
    h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">`;
    h+=`<span style="font-size:11px;font-weight:700;color:var(--t1)">${p.name}</span>`;
    h+=`<span class="fp-tag" style="background:rgba(${p.statusCls==='red'?'255,61,61':p.statusCls==='orange'?'255,136,0':'0,153,255'},0.15);color:var(--${p.statusCls})">${p.status}</span>`;
    h+=`</div>`;
    h+=`<div style="font-size:9px;color:var(--t2);margin-bottom:4px">${p.desc}</div>`;
    h+=`<div style="display:flex;gap:8px;font-size:9px;color:var(--t2);align-items:center">`;
    h+=`<span>响应等级：<b style="color:var(--${p.statusCls})">${p.level}</b></span>`;
    h+=`<span>条款：${p.articles}条</span>`;
    h+=`<span>匹配度：<b style="color:var(--green)">${p.match}%</b></span>`;
    h+=`<span style="flex:1"></span>`;
    h+=`<button class="plan-file-btn" onclick="openPlanDetail(${p.id})">&#128196; 查看全文</button>`;
    h+=`</div></div>`;
  });
  h+=`</div>`;
  // 预案关键条款
  h+=`<div class="fp-section">`;
  h+=`<div class="fp-title" style="color:var(--green);font-size:12px">&#128209; 关键条款摘要</div>`;
  planArticles.forEach(a=>{
    h+=`<div style="background:var(--card);border:1px solid var(--border);border-radius:5px;padding:8px;margin-bottom:5px;border-left:3px solid var(--green)">`;
    h+=`<div style="font-size:11px;font-weight:600;color:var(--t1);margin-bottom:3px">${a.id}. ${a.title}</div>`;
    h+=`<div style="font-size:10px;color:var(--t2);line-height:1.5">${a.content}</div>`;
    h+=`<div style="font-size:9px;color:var(--green);margin-top:3px">\ud83d\udccb ${a.ref}</div>`;
    h+=`</div>`;
  });
  h+=`</div>`;
  pc.innerHTML=h;
}

window.openPlanDetail=function(id){
  const p=planList.find(x=>x.id===id);
  if(!p)return;
  const articles=planDetailArticles[id]||[];
  const modal=document.getElementById('plan-modal-overlay');
  const titleEl=document.getElementById('plan-modal-title');
  const bodyEl=document.getElementById('plan-modal-body');
  titleEl.innerHTML=`<span>&#128220;</span> ${p.name}`;
  let body='';
  // 元信息
  body+=`<div class="plan-modal-meta">`;
  body+=`<span class="meta-tag" style="background:rgba(${p.statusCls==='red'?'255,61,61':p.statusCls==='orange'?'255,136,0':'0,153,255'},0.15);color:var(--${p.statusCls});border:1px solid rgba(${p.statusCls==='red'?'255,61,61':p.statusCls==='orange'?'255,136,0':'0,153,255'},0.3)">${p.status}</span>`;
  body+=`<span class="meta-tag" style="background:rgba(0,230,118,0.12);color:var(--green);border:1px solid rgba(0,230,118,0.3)">响应等级：${p.level}</span>`;
  body+=`<span class="meta-tag" style="background:rgba(0,153,255,0.12);color:var(--blue);border:1px solid rgba(0,153,255,0.3)">类型：${p.type}</span>`;
  body+=`<span class="meta-tag" style="background:rgba(176,96,255,0.12);color:var(--purple);border:1px solid rgba(176,96,255,0.3)">条款：${p.articles}条</span>`;
  body+=`<span class="meta-tag" style="background:rgba(0,230,118,0.12);color:var(--green);border:1px solid rgba(0,230,118,0.3)">匹配度：${p.match}%</span>`;
  body+=`</div>`;
  // 概述
  body+=`<div style="font-size:11px;color:var(--t2);line-height:1.7;margin-bottom:12px;padding:8px 12px;background:var(--card);border-radius:5px;border:1px solid var(--border)">${p.fullDesc}</div>`;
  // 示意内容声明
  body+=`<div style="font-size:10px;padding:6px 10px;border-radius:4px;background:rgba(255,136,0,0.08);border:1px solid rgba(255,136,0,0.25);color:var(--orange);margin-bottom:12px;line-height:1.5">&#9888; 以下条款为示意内容，仅供参考演示，不代表真实预案原文。正式预案请以政府发布版本为准。</div>`;
  // 条款列表
  body+=`<div class="plan-section-title">&#128209; 预案条款</div>`;
  articles.forEach(a=>{
    body+=`<div class="plan-article"><div class="plan-article-num">第${a.num}条 ${a.title}</div><div class="plan-article-text">${a.text}</div></div>`;
  });
  bodyEl.innerHTML=body;
  modal.classList.add('show');
};

window.generateCmdAIPlan=function(){
  const btn=document.getElementById('ai-plan-cmd-btn');
  const statusArea=document.getElementById('ai-plan-cmd-status');
  if(!btn||!statusArea)return;
  btn.disabled=true;
  btn.style.opacity='0.6';
  btn.textContent='AI生成中...';
  // 显示生成进度
  let step=0;
  const steps=[
    '正在分析当前态势数据...',
    '正在匹配历史预案知识库...',
    '正在运行推演模型...',
    '正在生成方案条款...',
    '正在评估方案可行性...'
  ];
  statusArea.innerHTML=`<div style="text-align:center;padding:8px"><div style="font-size:18px;margin-bottom:6px">&#9203;</div><div id="cmd-ai-step-text" style="font-size:10px;color:var(--t2)">${steps[0]}</div><div style="margin-top:6px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden"><div id="cmd-ai-progress" style="height:100%;width:0%;background:var(--orange);border-radius:2px;transition:width .4s"></div></div></div>`;
  const stepIv=setInterval(()=>{
    step++;
    if(step<steps.length){
      document.getElementById('cmd-ai-step-text').textContent=steps[step];
      document.getElementById('cmd-ai-progress').style.width=(step/(steps.length))*100+'%';
    }
  },500);
  setTimeout(()=>{
    clearInterval(stepIv);
    document.getElementById('cmd-ai-progress').style.width='100%';
    // 生成完成，显示结果

        <div style="font-size:9px;color:var(--t2);line-height:1.6">AI基于当前暴雨态势和推演结论自动生成，需专家审核确认后方可执行</div>
      </div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:5px;padding:8px;margin-bottom:6px">
        <div style="font-size:9px;color:var(--t2);margin-bottom:4px">预案条款（示意内容，仅供参考）：</div>
        <div style="font-size:9px;color:var(--t1);line-height:1.8">
          <div>1.1 响应启动：6h累计降雨85mm超黄色预警，符合${level}级响应条件</div>
          <div>2.1 人员转移：流村镇412户居民经推演优化路线转移至南口安置点</div>
          <div>2.2 回天地区：内涝风险升级红色预警，排水泵站全开</div>
          <div>3.1 交通管控：京藏高速南口段限速40km/h，进山道路封闭</div>
          <div>4.1 水库调度：十三陵水库预泄100m³/s，通知下游防洪</div>
          <div>5.1 物资保障：前置沙袋2000个、水泵15台至流村镇</div>
        </div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="act-btn act-btn-confirm" style="flex:1" onclick="confirmCmdAIPlan()">&#10003; 审核通过</button>

    `;

window.openAgentDetail=function(name){
  const d=agentDetails[name];
  if(!d)return;
  const modal=document.getElementById('agent-detail-overlay');
  const titleEl=document.getElementById('agent-detail-title');
  const bodyEl=document.getElementById('agent-detail-body');
  titleEl.innerHTML=`<span>${d.icon}</span> ${name}`;
  let h='';
  // Status tags
  h+=`<div class="ad-status-row">`;
  h+=`<span class="ad-status-tag" style="background:rgba(0,230,118,0.15);color:var(--green);border:1px solid rgba(0,230,118,0.3)">${d.status}</span>`;
  h+=`<span class="ad-status-tag" style="background:rgba(0,153,255,0.15);color:var(--blue);border:1px solid rgba(0,153,255,0.3)">运行 ${d.uptime}</span>`;
  h+=`<span class="ad-status-tag" style="background:rgba(176,96,255,0.15);color:var(--purple);border:1px solid rgba(176,96,255,0.3)">调用 ${d.calls}次</span>`;
  if(d.errors>0)h+=`<span class="ad-status-tag" style="background:rgba(255,61,61,0.15);color:var(--red);border:1px solid rgba(255,61,61,0.3)">错误 ${d.errors}</span>`;
  h+=`</div>`;
  // Description
  h+=`<div style="font-size:11px;color:var(--t2);line-height:1.7;margin-bottom:14px;padding:8px 12px;background:var(--card);border-radius:5px;border:1px solid var(--border)">${d.desc}</div>`;
  // Capabilities
  h+=`<div class="ad-section"><div class="ad-section-title">核心能力</div>`;
  d.capabilities.forEach(c=>{h+=`<div style="font-size:10px;color:var(--t2);line-height:1.6;padding:4px 0;padding-left:12px;border-left:2px solid var(--${d.color});margin-bottom:4px">${c}</div>`;});
  h+=`</div>`;
  // ReAct trace
  h+=`<div class="ad-section"><div class="ad-section-title">ReAct 运行轨迹（最近一次调用）</div>`;
  d.react.forEach(r=>{
    h+=`<div class="ad-react-step">`;
    h+=`<div class="ad-react-icon ${r.type}">${r.type==='thought'?'T':r.type==='action'?'A':'O'}</div>`;
    h+=`<div class="ad-react-content">`;
    h+=`<div class="ad-react-title">${r.title}</div>`;
    h+=`<div class="ad-react-text">${r.text}</div>`;
    h+=`<div class="ad-react-time">${r.time}</div>`;
    h+=`</div></div>`;
  });
  h+=`</div>`;
  // Metrics
  h+=`<div class="ad-section"><div class="ad-section-title">运行指标</div>`;
  h+=`<div class="ad-metric"><span class="ad-metric-label">平均响应时间</span><span class="ad-metric-value">${(0.8+Math.random()*1.2).toFixed(1)}s</span></div>`;
  h+=`<div class="ad-metric"><span class="ad-metric-label">成功率</span><span class="ad-metric-value" style="color:var(--green)">${(95+Math.random()*5).toFixed(1)}%</span></div>`;
  h+=`<div class="ad-metric"><span class="ad-metric-label">Skill命中次数</span><span class="ad-metric-value">${Math.floor(3+Math.random()*10)}</span></div>`;
  h+=`<div class="ad-metric"><span class="ad-metric-label">Loop循环次数(最近)</span><span class="ad-metric-value">${1+Math.floor(Math.random()*3)}</span></div>`;
  h+=`</div>`;
  bodyEl.innerHTML=h;
  modal.classList.add('show');
};

function renderAgentDetailPanel(panel,pc,name){
  const d=agentDetails[name];
  const wf=agentWorkflows[name];
  if(!d)return;
  const accentVar='var(--'+d.color+')';

  let h='';

  // 返回按钮
  h+=`<div class="agent-panel-back" onclick="returnToParentPanel()">`;
  h+=`<span class="back-arrow">‹</span> 返回${agentPanelReturn==='sense'?'态势感知':agentPanelReturn==='deduce'?'态势推演':agentPanelReturn==='command'?'指挥调度':agentPanelReturn==='review'?'灾后复盘':'上级'}`;
  h+=`</div>`;

  // 智能体头部
  h+=`<div class="agent-panel-header">`;
  h+=`<div class="aph-row">`;
  h+=`<span class="aph-icon">${d.icon}</span>`;
  h+=`<span class="aph-title" style="color:${accentVar}">${name}</span>`;
  h+=`<span style="margin-left:auto;width:6px;height:6px;border-radius:50%;background:${d.status==='运行中'?'var(--green)':'var(--yellow)'};animation:blink 2s infinite"></span>`;
  h+=`</div>`;
  h+=`<div class="aph-tags">`;
  h+=`<span class="aph-tag" style="background:rgba(0,230,118,0.15);color:var(--green);border:1px solid rgba(0,230,118,0.3)">${d.status}</span>`;
  h+=`<span class="aph-tag" style="background:rgba(0,153,255,0.15);color:var(--blue);border:1px solid rgba(0,153,255,0.3)">运行 ${d.uptime}</span>`;
  h+=`<span class="aph-tag" style="background:rgba(176,96,255,0.15);color:var(--purple);border:1px solid rgba(176,96,255,0.3)">调用 ${d.calls}次</span>`;
  if(d.errors>0)h+=`<span class="aph-tag" style="background:rgba(255,61,61,0.15);color:var(--red);border:1px solid rgba(255,61,61,0.3)">错误 ${d.errors}</span>`;
  h+=`</div>`;
  h+=`<div style="font-size:10px;color:var(--t2);line-height:1.6;margin-top:6px;padding:6px 8px;background:var(--card);border-radius:5px;border:1px solid var(--border)">${d.desc}</div>`;
  h+=`</div>`;

  // Tab栏
  h+=`<div class="agent-panel-tabs">`;
  h+=`<div class="agent-panel-tab ${agentPanelTab==='workflow'?'active':''}" onclick="switchAgentPanelTab('workflow','${name}')"><span class="tab-icon">&#9881;</span>核心工作流程</div>`;
  h+=`<div class="agent-panel-tab ${agentPanelTab==='detail'?'active':''}" onclick="switchAgentPanelTab('detail','${name}')"><span class="tab-icon">&#128203;</span>详细信息</div>`;
  h+=`</div>`;

  if(agentPanelTab==='workflow'){
    // Tab1: 核心工作流程
    if(wf){
      h+=`<div class="wf-section">`;
      h+=`<div class="wf-section-title" style="color:${accentVar}"><span>&#128640;</span> 核心工作流程（${wf.steps.length}步）</div>`;
      wf.steps.forEach(s=>{
        h+=`<div class="wf-step">`;
        h+=`<div class="wf-dot ${s.dot}"></div>`;
        h+=`<div class="wf-title">${s.title}</div>`;
        h+=`<div class="wf-desc">${s.desc}</div>`;
        if(s.meta){
          h+=`<div class="wf-meta">`;
          s.meta.forEach(m=>{h+=`<span class="wf-meta-tag">${m}</span>`;});
          h+=`</div>`;
        }
        h+=`</div>`;
      });
      h+=`</div>`;
    }
  }else{
    // Tab2: 详细信息（原弹窗内容）
    // 核心能力
    h+=`<div class="wf-section">`;
    h+=`<div class="wf-section-title" style="color:${accentVar}"><span>&#128170;</span> 核心能力</div>`;
    d.capabilities.forEach(c=>{
      h+=`<div class="panel-cap-item" style="border-left-color:${accentVar}">${c}</div>`;
    });
    h+=`</div>`;

    // ReAct运行轨迹
    h+=`<div class="wf-section">`;
    h+=`<div class="wf-section-title" style="color:${accentVar}"><span>&#128300;</span> ReAct 运行轨迹</div>`;
    d.react.forEach(r=>{
      h+=`<div class="panel-react-step">`;
      h+=`<div class="panel-react-icon ${r.type}">${r.type==='thought'?'T':r.type==='action'?'A':'O'}</div>`;
      h+=`<div class="panel-react-content">`;
      h+=`<div class="panel-react-title">${r.title}</div>`;
      h+=`<div class="panel-react-text">${r.text}</div>`;
      h+=`<div class="panel-react-time">${r.time}</div>`;
      h+=`</div></div>`;
    });
    h+=`</div>`;

    // 运行指标
    h+=`<div class="wf-section">`;
    h+=`<div class="wf-section-title" style="color:${accentVar}"><span>&#128202;</span> 运行指标</div>`;
    const respTime=(0.8+(d.calls%10)*0.12).toFixed(1);
    const successRate=(95+(d.calls%5)*0.8).toFixed(1);
    const skillHits=Math.floor(3+(d.calls%10));
    const loops=1+(d.calls%3);
    h+=`<div class="panel-metric"><span class="panel-metric-label">平均响应时间</span><span class="panel-metric-value">${respTime}s</span></div>`;
    h+=`<div class="panel-metric"><span class="panel-metric-label">成功率</span><span class="panel-metric-value" style="color:var(--green)">${successRate}%</span></div>`;
    h+=`<div class="panel-metric"><span class="panel-metric-label">Skill命中次数</span><span class="panel-metric-value">${skillHits}</span></div>`;
    h+=`<div class="panel-metric"><span class="panel-metric-label">Loop循环次数(最近)</span><span class="panel-metric-value">${loops}</span></div>`;
    h+=`</div>`;
  }

  pc.innerHTML=h;
}

};

// ===== 动态化：传感器计数动画 + 告警弹出 =====
let sensorTarget=2847,sensorCurrent=0;
function animateSensors(){
  const el=document.querySelector('.top-right b[style*="green"]');
  if(!el||!el.parentElement||!el.parentElement.textContent.includes('传感器'))return;
  if(sensorCurrent<sensorTarget){
    sensorCurrent+=Math.floor((sensorTarget-sensorCurrent)*0.1)+1;
    if(sensorCurrent>sensorTarget)sensorCurrent=sensorTarget;
    el.textContent=sensorCurrent.toLocaleString();
  }
}
setInterval(animateSensors,800);

// 告警计数动态更新
let alertCount=5;
setInterval(()=>{
  if(Math.random()>0.7){
    alertCount=Math.max(1,alertCount+Math.floor(Math.random()*3)-1);
    const alertEl=document.querySelector('.top-right b[style*="orange"]');
    if(alertEl&&alertEl.parentElement&&alertEl.parentElement.textContent.includes('告警'))alertEl.textContent=alertCount;
  }
},5000);

let demoRunning=false,demoTimers=[];
window.startDemo=function(){
  if(demoRunning)return;
  demoRunning=true;
  const indicator=document.getElementById('demo-step-indicator');
  const fill=document.getElementById('demo-progress-fill');
  indicator.classList.add('show');
  
  let globalT=0;
  const totalDuration=demoPhases.reduce((s,p)=>s+p.duration,0);
  
  demoPhases.forEach(phase=>{
    phase.actions.forEach(action=>{
      const timer=setTimeout(()=>{
        action.fn();
        // Update progress indicator
        indicator.className='demo-step-indicator show phase-'+phase.phase;
        indicator.innerHTML=`<span>${phase.label}</span>`;
        fill.className='demo-progress-fill phase-'+phase.phase;
        fill.style.width=phase.progress+'%';
      },(globalT+action.t)*1000);
      demoTimers.push(timer);
    });
    globalT+=phase.duration;
  });
  
  // Auto-stop at end
  const endTimer=setTimeout(()=>{
    demoRunning=false;
    fill.style.width='100%';
    setTimeout(()=>{indicator.classList.remove('show');fill.style.width='0%';},3000);
  },globalT*1000);
  demoTimers.push(endTimer);
};

window.stopDemo=function(){
  demoTimers.forEach(t=>clearTimeout(t));
  demoTimers=[];
  demoRunning=false;
  document.getElementById('demo-step-indicator').classList.remove('show');
  document.getElementById('demo-progress-fill').style.width='0%';
};
