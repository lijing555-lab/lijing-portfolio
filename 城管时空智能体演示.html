window.openAgentDetail=function(name){
  const d=agentDetails[name];
  if(!d)return;
  const modal=document.getElementById('agent-detail-overlay');
  const titleEl=document.getElementById('agent-detail-title');
  const bodyEl=document.getElementById('agent-detail-body');
  titleEl.innerHTML=`<span>${d.icon}</span> ${name}`;
  let h='';
  // Status tags
  h+=`<div class="ad-status-row">`;
  h+=`<span class="ad-status-tag" style="background:rgba(0,230,118,0.15);color:var(--green);border:1px solid rgba(0,230,118,0.3)">${d.status}</span>`;
  h+=`<span class="ad-status-tag" style="background:rgba(0,153,255,0.15);color:var(--blue);border:1px solid rgba(0,153,255,0.3)">运行 ${d.uptime}</span>`;
  h+=`<span class="ad-status-tag" style="background:rgba(176,96,255,0.15);color:var(--purple);border:1px solid rgba(176,96,255,0.3)">调用 ${d.calls}次</span>`;
  if(d.errors>0)h+=`<span class="ad-status-tag" style="background:rgba(255,61,61,0.15);color:var(--red);border:1px solid rgba(255,61,61,0.3)">错误 ${d.errors}</span>`;
  h+=`</div>`;
  // Description
  h+=`<div style="font-size:11px;color:var(--t2);line-height:1.7;margin-bottom:14px;padding:8px 12px;background:var(--card);border-radius:5px;border:1px solid var(--border)">${d.desc}</div>`;
  // Capabilities
  h+=`<div class="ad-section"><div class="ad-section-title">核心能力</div>`;
  d.capabilities.forEach(c=>{h+=`<div style="font-size:10px;color:var(--t2);line-height:1.6;padding:4px 0;padding-left:12px;border-left:2px solid var(--${d.color});margin-bottom:4px">${c}</div>`;});
  h+=`</div>`;
  // ReAct trace
  h+=`<div class="ad-section"><div class="ad-section-title">ReAct 运行轨迹（最近一次调用）</div>`;
  d.react.forEach(r=>{
    h+=`<div class="ad-react-step">`;
    h+=`<div class="ad-react-icon ${r.type}">${r.type==='thought'?'T':r.type==='action'?'A':'O'}</div>`;
    h+=`<div class="ad-react-content">`;
    h+=`<div class="ad-react-title">${r.title}</div>`;
    h+=`<div class="ad-react-text">${r.text}</div>`;
    h+=`<div class="ad-react-time">${r.time}</div>`;
    h+=`</div></div>`;
  });
  h+=`</div>`;
  // Metrics
  h+=`<div class="ad-section"><div class="ad-section-title">运行指标</div>`;
  h+=`<div class="ad-metric"><span class="ad-metric-label">平均响应时间</span><span class="ad-metric-value">${(0.8+Math.random()*1.2).toFixed(1)}s</span></div>`;
  h+=`<div class="ad-metric"><span class="ad-metric-label">成功率</span><span class="ad-metric-value" style="color:var(--green)">${(95+Math.random()*5).toFixed(1)}%</span></div>`;
  h+=`<div class="ad-metric"><span class="ad-metric-label">Skill命中次数</span><span class="ad-metric-value">${Math.floor(3+Math.random()*10)}</span></div>`;
  h+=`<div class="ad-metric"><span class="ad-metric-label">Loop循环次数(最近)</span><span class="ad-metric-value">${1+Math.floor(Math.random()*3)}</span></div>`;
  h+=`</div>`;
  bodyEl.innerHTML=h;
  modal.classList.add('show');
};

// ===== 动态化：传感器计数动画 + 告警弹出 =====
let sensorTarget=2847,sensorCurrent=0;
function animateSensors(){
  const el=document.querySelector('.top-right b[style*="green"]');
  if(!el||!el.parentElement||!el.parentElement.textContent.includes('传感器'))return;
  if(sensorCurrent<sensorTarget){
    sensorCurrent+=Math.floor((sensorTarget-sensorCurrent)*0.1)+1;
    if(sensorCurrent>sensorTarget)sensorCurrent=sensorTarget;
    el.textContent=sensorCurrent.toLocaleString();
  }
}
setInterval(animateSensors,800);

// 告警计数动态更新

setInterval(()=>{
  if(Math.random()>0.7){
    alertCount=Math.max(1,alertCount+Math.floor(Math.random()*3)-1);
    const alertEl=document.querySelector('.top-right b[style*="orange"]');
    if(alertEl&&alertEl.parentElement&&alertEl.parentElement.textContent.includes('告警'))alertEl.textContent=alertCount;
  }
},5000);

let demoRunning=false,demoTimers=[];
window.startDemo=function(){
  if(demoRunning)return;
  demoRunning=true;
  const indicator=document.getElementById('demo-step-indicator');
  const fill=document.getElementById('demo-progress-fill');
  indicator.classList.add('show');
  
  let globalT=0;
  const totalDuration=demoPhases.reduce((s,p)=>s+p.duration,0);
  
  demoPhases.forEach(phase=>{
    phase.actions.forEach(action=>{
      const timer=setTimeout(()=>{
        action.fn();
        // Update progress indicator
        indicator.className='demo-step-indicator show phase-'+phase.phase;
        indicator.innerHTML=`<span>${phase.label}</span>`;
        fill.className='demo-progress-fill phase-'+phase.phase;
        fill.style.width=phase.progress+'%';
      },(globalT+action.t)*1000);
      demoTimers.push(timer);
    });
    globalT+=phase.duration;
  });
  
  // Auto-stop at end
  const endTimer=setTimeout(()=>{
    demoRunning=false;
    fill.style.width='100%';
    setTimeout(()=>{indicator.classList.remove('show');fill.style.width='0%';},3000);
  },globalT*1000);
  demoTimers.push(endTimer);
};

window.stopDemo=function(){
  demoTimers.forEach(t=>clearTimeout(t));
  demoTimers=[];
  demoRunning=false;
  document.getElementById('demo-step-indicator').classList.remove('show');
  document.getElementById('demo-progress-fill').style.width='0%';
};

.top-left{display:flex;align-items:center;gap:10px;padding-left:20px}
.logo-icon{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,#0066cc,#00aaff);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;color:#fff}
.logo-text{font-size:16px;font-weight:700;background:linear-gradient(90deg,#0099ff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sep{color:rgba(30,80,160,0.4);font-size:20px;margin:0 8px;font-weight:200}
.nav-group{display:flex;align-items:center;gap:2px;height:100%}
.nav-item{height:100%;padding:0 16px;display:flex;align-items:center;gap:6px;cursor:pointer;position:relative;transition:all .25s;border:none;background:none;font-family:var(--font);font-size:14px;color:var(--t2);font-weight:500}
.nav-item:hover{color:var(--t1);background:rgba(0,80,180,0.06)}
.nav-item::after{content:'';position:absolute;bottom:0;left:16px;right:16px;height:2px;border-radius:1px;background:transparent;transition:all .25s}
.nav-item .nav-icon{font-size:16px;opacity:0.7;transition:opacity .25s}
.nav-item:hover .nav-icon{opacity:1}
.nav-item.active-sense{color:var(--cyan)}
.nav-item.active-sense::after{background:var(--cyan)}
.nav-item.active-sense .nav-icon{opacity:1}
.nav-item.active-deduce{color:var(--purple)}
.nav-item.active-deduce::after{background:var(--purple)}
.nav-item.active-deduce .nav-icon{opacity:1}
.nav-item.active-command{color:var(--orange)}
.nav-item.active-command::after{background:var(--orange)}
.nav-item.active-command .nav-icon{opacity:1}
.nav-item.active-review{color:var(--yellow)}
.nav-item.active-review::after{background:var(--yellow)}
.nav-item.active-review .nav-icon{opacity:1}
.nav-item.active-bus{color:var(--blue)}
.nav-item.active-bus::after{background:var(--blue)}
.nav-item.active-bus .nav-icon{opacity:1}
.top-right{display:flex;align-items:center;gap:16px;font-size:12px;color:var(--t2);padding-right:20px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px;animation:blink 2s infinite}
.dot-on{background:var(--green)}.dot-warn{background:var(--orange)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}

/* ===== 主布局 ===== */
.main{position:absolute;top:56px;bottom:48px;left:0;right:0;display:flex}

/* ===== 左侧地图区 ===== */
.map-area{flex:1;position:relative;overflow:hidden}
#map{width:100%;height:100%;z-index:1}
.leaflet-tile-pane{filter:saturate(0.35) brightness(0.55) contrast(1.25)}
.leaflet-control-attribution{display:none!important}
.leaflet-control-zoom{border:1px solid var(--border)!important;background:var(--panel)!important}
.leaflet-control-zoom a{background:var(--card)!important;color:var(--t2)!important;border-color:var(--border)!important}
.leaflet-control-zoom a:hover{color:var(--cyan)!important}

.map-overlay{position:absolute;top:12px;left:12px;z-index:500;display:flex;flex-direction:column;gap:6px}
.map-btn{padding:5px 12px;border-radius:4px;border:1px solid var(--border);background:var(--panel);color:var(--t2);font-size:11px;cursor:pointer;font-family:var(--font);transition:all .2s;backdrop-filter:blur(8px);z-index:500}
.map-btn:hover,.map-btn.active{border-color:var(--blue);color:var(--cyan);background:rgba(0,80,180,0.2)}
.map-legend{position:absolute;bottom:12px;left:12px;z-index:500;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px 12px;backdrop-filter:blur(8px)}
.legend-item{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--t2);margin:2px 0}
.legend-dot{width:8px;height:8px;border-radius:50%}
.legend-line{width:20px;height:3px;border-radius:2px}

/* ===== 推演面板 ===== */
.predict-timeline{display:flex;gap:4px;margin-top:8px;align-items:center}
.predict-node{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--purple);background:transparent;position:relative}
.predict-node.filled{background:var(--purple)}
.predict-node.active{background:var(--red);border-color:var(--red);box-shadow:0 0 6px rgba(255,61,61,0.5)}
.predict-line{flex:1;height:1px;background:rgba(176,96,255,0.3)}
.predict-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--t2);margin-top:4px}

/* ===== 推演地图图例 ===== */
.predict-map-legend{background:var(--card);border:1px solid var(--purple);border-radius:6px;padding:10px 14px;min-width:220px;display:none;backdrop-filter:blur(12px);box-shadow:0 0 12px rgba(176,96,255,0.08);margin-top:8px}
.predict-map-legend.show{display:block}
.pml-title{font-size:12px;font-weight:700;color:var(--purple);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.pml-section{margin-bottom:8px}
.pml-section-title{font-size:10px;font-weight:600;color:var(--t1);margin-bottom:4px;padding-bottom:2px;border-bottom:1px solid rgba(255,255,255,0.06)}
.pml-row{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--t2);margin:3px 0;line-height:1.5}
.pml-color{width:20px;height:10px;border-radius:3px;flex-shrink:0}
.pml-color.dashed{background:repeating-linear-gradient(90deg,var(--purple) 0,var(--purple) 4px,transparent 4px,transparent 8px);height:2px;margin-top:4px}
.pml-val{font-family:var(--mono);font-weight:700;color:var(--t1);margin-left:auto;white-space:nowrap}
.pml-val.danger{color:var(--red)}.pml-val.warn{color:var(--orange)}.pml-val.info{color:var(--cyan)}

/* 推演步骤卡片 */
.predict-step-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:8px;transition:all .3s}
.predict-step-card.active{border-color:var(--purple);box-shadow:0 0 12px rgba(176,96,255,0.15)}
.predict-step-time{font-size:10px;font-weight:700;color:var(--purple);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.predict-step-time .now-tag{font-size:8px;padding:1px 5px;border-radius:3px;background:rgba(0,212,255,0.15);color:var(--cyan);border:1px solid rgba(0,212,255,0.3)}
.predict-step-time .future-tag{font-size:8px;padding:1px 5px;border-radius:3px;background:rgba(176,96,255,0.15);color:var(--purple);border:1px solid rgba(176,96,255,0.3)}
.predict-step-text{font-size:11px;line-height:1.7;color:var(--t2)}
.predict-step-text b{color:var(--t1);font-weight:600}
.predict-step-text .highlight-red{color:var(--red);font-weight:700;font-family:var(--mono)}
.predict-step-text .highlight-orange{color:var(--orange);font-weight:700;font-family:var(--mono)}
.predict-step-text .highlight-cyan{color:var(--cyan);font-weight:700;font-family:var(--mono)}

/* ===== 右侧面板 ===== */
.panel{width:440px;overflow:visible;border-left:1px solid var(--border);background:var(--panel);backdrop-filter:blur(12px);display:flex;flex-direction:column;z-index:500;position:relative;min-height:0;flex-shrink:0;transition:width .35s cubic-bezier(0.4,0,0.2,1)}
.panel.collapsed{width:0;overflow:hidden;border-left:none}
.panel::-webkit-scrollbar{width:3px}
.panel::-webkit-scrollbar-thumb{background:rgba(0,80,180,0.3);border-radius:2px}

.panel-section{padding:12px 16px;border-bottom:1px solid var(--border)}
.section-title{font-size:12px;font-weight:600;color:var(--cyan);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.section-title .dot{width:5px;height:5px;background:var(--cyan)}
.section-title.theme-city{color:var(--cyan)}.section-title.theme-city .dot{background:var(--cyan)}
.section-title.theme-emergency{color:var(--red)}.section-title.theme-emergency .dot{background:var(--red)}

/* 态势推演标签切换 */
.tab-group{display:flex;gap:2px;margin-bottom:8px}
.tab-btn{padding:4px 12px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--t2);font-size:11px;cursor:pointer;font-family:var(--font);transition:all .2s}
.tab-btn:hover{border-color:var(--purple);color:var(--purple)}
.tab-btn.active{border-color:var(--purple);color:var(--purple);background:rgba(176,96,255,0.1)}

.stats{display:flex;gap:6px}
.stat{flex:1;padding:8px 4px;background:var(--card);border-radius:4px;border:1px solid var(--border);text-align:center}
.stat-val{font-size:18px;font-weight:700;font-family:var(--mono)}
.stat-val.red{color:var(--red)}.stat-val.orange{color:var(--orange)}.stat-val.green{color:var(--green)}.stat-val.blue{color:var(--cyan)}.stat-val.yellow{color:var(--yellow)}.stat-val.purple{color:var(--purple)}
.stat-label{font-size:9px;color:var(--t2);margin-top:2px}

.dim-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:2px}
.dim-card{padding:6px 8px;background:var(--card);border:1px solid var(--border);border-radius:4px;cursor:pointer;transition:all .2s}
.dim-label{font-size:9px;color:var(--t2);margin-bottom:2px}
.dim-val{font-size:14px;font-weight:700;font-family:var(--mono)}
.dim-bar{height:2px;border-radius:1px;background:rgba(255,255,255,0.06);margin-top:3px;overflow:hidden}
.dim-bar-fill{height:100%;border-radius:2px;transition:width .5s}

.traffic-section{margin-top:4px}
.traffic-row{display:flex;align-items:center;gap:4px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:10px}
.traffic-row:last-child{border-bottom:none}
.road-name{flex:1;color:var(--t1);font-weight:500}
.road-status{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:600}
.road-status.smooth{background:rgba(0,230,118,0.12);color:var(--green);border:1px solid rgba(0,230,118,0.3)}
.road-status.slow{background:rgba(255,204,0,0.1);color:var(--yellow);border:1px solid rgba(255,204,0,0.3)}
.road-status.congested{background:rgba(255,136,0,0.1);color:var(--orange);border:1px solid rgba(255,136,0,0.3)}
.road-status.jammed{background:rgba(255,61,61,0.1);color:var(--red);border:1px solid rgba(255,61,61,0.3)}
.road-speed{font-family:var(--mono);font-size:10px;color:var(--t2);min-width:40px;text-align:right}

.metro-section{margin-top:4px}
.metro-line-header{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;margin-bottom:4px}
.metro-dot{width:10px;height:10px;border-radius:50%}
.metro-station-row{display:flex;align-items:center;gap:6px;padding:3px 0 3px 16px;font-size:10px}
.metro-stn-name{flex:1;color:var(--t1)}
.metro-flow{font-family:var(--mono);font-size:10px}
.metro-flow.high{color:var(--red)}.metro-flow.mid{color:var(--orange)}.metro-flow.low{color:var(--green)}
.metro-flow-bar{width:50px;height:3px;border-radius:2px;background:rgba(255,255,255,0.06);overflow:hidden;display:inline-block;vertical-align:middle}
.metro-flow-bar-inner{height:100%;border-radius:2px}

.event-list{max-height:150px;overflow-y:auto}
.event-item{padding:4px 8px;border-radius:3px;background:var(--card);border:1px solid var(--border);margin-bottom:3px;font-size:10px;display:flex;align-items:flex-start;gap:6px;transition:all .3s;cursor:pointer}
.event-item:hover{border-color:var(--glow)}
.event-item.active-city{border-color:var(--cyan);background:rgba(0,100,200,0.08)}
.event-item.active-emergency{border-color:var(--red);background:rgba(255,60,60,0.08)}
.event-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
.event-dot.red{background:var(--red)}.event-dot.orange{background:var(--orange)}.event-dot.green{background:var(--green)}.event-dot.yellow{background:var(--yellow)}
.event-title{font-weight:600;color:var(--t1)}.event-desc{color:var(--t2);font-size:10px;margin-top:1px}

/* 智能体分析区块 */
.t-block{margin-top:8px;border-radius:5px;border-left:3px solid;overflow:hidden}
.t-source{border-color:var(--blue)}.t-think{border-color:var(--purple)}.t-action{border-color:var(--green)}.t-collab{border-color:var(--yellow)}.t-predict{border-color:var(--orange)}.t-response{border-color:var(--red)}
.t-title{padding:5px 8px;font-size:10px;font-weight:600;display:flex;align-items:center;gap:5px}
.t-source .t-title{background:rgba(0,80,180,0.15);color:var(--cyan)}
.t-think .t-title{background:rgba(150,60,255,0.1);color:var(--purple)}
.t-action .t-title{background:rgba(0,180,100,0.1);color:var(--green)}
.t-collab .t-title{background:rgba(255,200,0,0.1);color:var(--yellow)}
.t-predict .t-title{background:rgba(255,136,0,0.1);color:var(--orange)}
.t-response .t-title{background:rgba(255,61,61,0.1);color:var(--red)}
.t-content{padding:6px 8px;font-size:11px;line-height:1.7;color:var(--t2);background:rgba(0,0,0,0.15)}
.tag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;background:rgba(0,80,180,0.2);color:var(--cyan);margin:1px 3px 1px 0}
.step{display:flex;gap:5px;margin:2px 0}
.step-n{width:16px;height:16px;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.t-source .step-n{background:rgba(0,80,180,0.25);color:var(--cyan)}
.t-think .step-n{background:rgba(150,60,255,0.2);color:var(--purple)}
.act-row{display:flex;align-items:center;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.act-row:last-child{border-bottom:none}
.badge{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:500;white-space:nowrap}
.badge-auto{background:rgba(0,230,118,0.12);color:var(--green);border:1px solid rgba(0,230,118,0.3)}
.badge-manual{background:rgba(255,170,0,0.1);color:#ffaa00;border:1px solid rgba(255,170,0,0.3)}
.badge-pending{background:rgba(100,120,150,0.12);color:var(--t2);border:1px solid rgba(100,120,150,0.3)}
.badge-confirm{background:rgba(255,136,0,0.1);color:var(--orange);border:1px solid rgba(255,136,0,0.3);cursor:pointer;transition:all .2s}
.badge-confirm:hover{background:rgba(0,230,118,0.12);color:var(--green);border-color:rgba(0,230,118,0.3)}
.badge-confirmed{background:rgba(0,230,118,0.12);color:var(--green);border:1px solid rgba(0,230,118,0.3)}
.badge-level{background:rgba(255,61,61,0.15);color:var(--red);border:1px solid rgba(255,61,61,0.3)}
.act-ref{font-size:9px;color:var(--t2);margin-top:2px;padding-left:22px;font-style:italic;opacity:0.7}
.act-row-wrap{padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.act-row-wrap:last-child{border-bottom:none}
.act-btns{display:flex;gap:4px;margin-top:3px;padding-left:22px}
.act-btn{font-size:9px;padding:2px 8px;border-radius:3px;cursor:pointer;font-family:var(--font);font-weight:600;transition:all .2s;border:1px solid}
.act-btn-confirm{background:rgba(0,230,118,0.1);color:var(--green);border-color:rgba(0,230,118,0.3)}
.act-btn-confirm:hover{background:rgba(0,230,118,0.25)}
.act-btn-confirm.confirmed{background:rgba(0,230,118,0.15);color:var(--green);border-color:rgba(0,230,118,0.4);cursor:default;opacity:0.7}
.act-btn-modify{background:rgba(255,170,0,0.1);color:#ffaa00;border-color:rgba(255,170,0,0.3)}
.act-btn-modify:hover{background:rgba(255,170,0,0.25)}
.act-btn-modify.editing{background:rgba(0,212,255,0.1);color:var(--cyan);border-color:rgba(0,212,255,0.3)}
.act-edit-input{width:100%;padding:4px 8px;margin-top:3px;background:rgba(0,0,0,0.3);border:1px solid var(--cyan);border-radius:4px;color:var(--t1);font-size:11px;font-family:var(--font);outline:none;display:none}
.act-edit-input:focus{box-shadow:0 0 8px rgba(0,180,255,0.2)}
/* 预案依据卡片 */
.plan-card{margin-top:6px;border-radius:5px;border:1px solid rgba(255,61,61,0.3);overflow:hidden}
.plan-card-header{padding:6px 10px;background:rgba(255,61,61,0.12);display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--red)}
.plan-card-header .plan-icon{font-size:13px}
.plan-card-body{padding:8px 10px;background:rgba(0,0,0,0.15)}
.plan-item{display:flex;gap:6px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:10px;line-height:1.6}
.plan-item:last-child{border-bottom:none}
.plan-clause{color:var(--red);font-weight:600;white-space:nowrap;min-width:80px}
.plan-desc{color:var(--t2);flex:1}
.plan-level-tag{font-size:9px;padding:1px 6px;border-radius:3px;font-weight:600;display:inline-block;margin-left:4px}
.plan-level-III{background:rgba(255,61,61,0.15);color:var(--red);border:1px solid rgba(255,61,61,0.3)}
.plan-level-IV{background:rgba(255,136,0,0.15);color:var(--orange);border:1px solid rgba(255,136,0,0.3)}

.collab-row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.collab-row:last-child{border-bottom:none}
.dept-badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600;white-space:nowrap}
.dept-badge.yingji{background:rgba(176,96,255,0.15);color:var(--purple);border:1px solid rgba(176,96,255,0.3)}
.dept-badge.xiaofang{background:rgba(255,61,61,0.15);color:var(--red);border:1px solid rgba(255,61,61,0.3)}
.dept-badge.jiaojing{background:rgba(0,153,255,0.15);color:var(--blue);border:1px solid rgba(0,153,255,0.3)}
.dept-badge.chenguan{background:rgba(255,136,0,0.15);color:var(--orange);border:1px solid rgba(255,136,0,0.3)}
.dept-badge.minzheng{background:rgba(255,204,0,0.15);color:var(--yellow);border:1px solid rgba(255,204,0,0.3)}
.dept-badge.jiaowei{background:rgba(0,212,255,0.15);color:var(--cyan);border:1px solid rgba(0,212,255,0.3)}
.dept-badge.shuiwu{background:rgba(0,153,255,0.15);color:var(--blue);border:1px solid rgba(0,153,255,0.3)}
.dept-badge.weisheng{background:rgba(0,230,118,0.15);color:var(--green);border:1px solid rgba(0,230,118,0.3)}
.collab-arrow{color:var(--t2);font-size:10px;flex-shrink:0}
.collab-desc{font-size:10px;color:var(--t2);flex:1}

.exec-btn{margin-top:8px;width:100%;padding:7px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:var(--font)}
.exec-btn:hover{box-shadow:0 0 12px rgba(0,100,255,0.15)}
.exec-btn.executing{animation:btn-pulse 1s infinite}
@keyframes btn-pulse{0%,100%{opacity:1}50%{opacity:0.7}}
.exec-btn.btn-city{border:1px solid var(--blue);background:rgba(0,100,200,0.08);color:var(--cyan)}
.exec-btn.btn-city:hover{background:rgba(0,100,200,0.2)}
.exec-btn.btn-emergency{border:1px solid var(--red);background:rgba(255,60,60,0.08);color:var(--red)}
.exec-btn.btn-emergency:hover{background:rgba(255,60,60,0.2)}

/* ===== 对话框（右侧面板内嵌） ===== */
.chat-drawer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:600;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;transform:translateY(-100%);transition:transform .35s cubic-bezier(0.4,0,0.2,1),opacity .25s ease;backdrop-filter:blur(16px);opacity:0;visibility:hidden}
.chat-drawer.open{transform:translateY(0);opacity:1;visibility:visible}
.chat-toggle{position:absolute;left:-28px;top:65%;transform:translateY(-50%);z-index:601;width:28px;height:64px;border-radius:6px 0 0 6px;background:var(--panel);border:1px solid var(--border);border-right:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--cyan);font-size:14px;transition:all .35s cubic-bezier(0.4,0,0.2,1);font-weight:700}
.chat-toggle:hover{color:var(--cyan);border-color:var(--cyan);background:rgba(0,100,200,0.1)}
.chat-toggle.open{left:0;top:0;height:40px;border-radius:0;transform:none;background:var(--panel);border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.chat-toggle .toggle-icon{transition:transform .3s}
.chat-toggle.open .toggle-icon{transform:rotate(180deg)}

.chat-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.chat-header-title{font-size:13px;font-weight:700;color:var(--cyan);display:flex;align-items:center;gap:6px}
.chat-header-title .ai-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s infinite}

.chat-body{flex:1;overflow-y:auto;padding:10px 14px}
.chat-body::-webkit-scrollbar{width:2px}
.chat-body::-webkit-scrollbar-thumb{background:rgba(0,80,180,0.3);border-radius:1px}

.chat-msg{padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.7;margin-bottom:8px;animation:chatIn .3s ease-out}
@keyframes chatIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.user{background:rgba(0,100,200,0.15);color:var(--t1);border:1px solid rgba(0,100,200,0.25);margin-left:30px;text-align:right}
.chat-msg.agent{background:var(--card);color:var(--t2);border:1px solid var(--border);margin-right:20px}

/* 思考过程展示 */
.thinking-block{margin:6px 0;border-radius:5px;border:1px solid rgba(176,96,255,0.3);overflow:hidden;animation:chatIn .4s ease-out}
.thinking-header{padding:5px 8px;background:rgba(176,96,255,0.1);font-size:10px;font-weight:600;color:var(--purple);display:flex;align-items:center;gap:5px;cursor:pointer}
.thinking-header .arrow{transition:transform .2s;font-size:8px}
.thinking-header.collapsed .arrow{transform:rotate(-90deg)}
.thinking-body{padding:6px 8px;font-size:11px;line-height:1.7;color:var(--t2);background:rgba(0,0,0,0.1)}
.thinking-step{display:flex;gap:6px;margin:3px 0;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.thinking-step:last-child{border-bottom:none}
.thinking-step .num{width:16px;height:16px;border-radius:50%;background:rgba(176,96,255,0.2);color:var(--purple);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.thinking-step .txt{flex:1}

/* 处置流程展示 */
.flow-block{margin:6px 0;border-radius:5px;border:1px solid rgba(0,230,118,0.3);overflow:hidden;animation:chatIn .4s ease-out}
.flow-header{padding:5px 8px;background:rgba(0,180,100,0.1);font-size:10px;font-weight:600;color:var(--green);display:flex;align-items:center;gap:5px}
.flow-body{padding:6px 8px;font-size:11px;line-height:1.7;color:var(--t2);background:rgba(0,0,0,0.1)}
.flow-step{display:flex;gap:6px;align-items:flex-start;margin:3px 0;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.flow-step:last-child{border-bottom:none}
.flow-step .icon{flex-shrink:0;font-size:12px}
.flow-step .dept{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600}
.flow-step .desc{flex:1}

.chat-input-area{padding:10px 14px;border-top:1px solid var(--border);background:rgba(8,16,36,0.5)}
.chat-suggestions{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.chat-sug{padding:3px 8px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--t2);font-size:10px;cursor:pointer;transition:all .2s}
.chat-sug:hover{border-color:var(--cyan);color:var(--cyan)}
.chat-input-wrap{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
.chat-input-wrap:focus-within{border-color:var(--cyan);box-shadow:0 0 12px rgba(0,180,255,0.15)}
.chat-input{flex:1;background:transparent;border:none;outline:none;color:var(--t1);font-size:12px;font-family:var(--font)}
.chat-input::placeholder{color:rgba(100,120,150,0.5)}
.chat-send{padding:4px 14px;border-radius:6px;border:1px solid var(--cyan);background:rgba(0,100,200,0.1);color:var(--cyan);font-size:11px;cursor:pointer;font-family:var(--font);font-weight:600;transition:all .2s}
.chat-send:hover{background:rgba(0,100,200,0.25)}
.chat-typing{display:inline-flex;gap:3px;padding:4px 0}
.chat-typing span{width:4px;height:4px;border-radius:50%;background:var(--cyan);animation:typing 1.2s infinite}
.chat-typing span:nth-child(2){animation-delay:.2s}
.chat-typing span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{opacity:0.3;transform:scale(0.8)}30%{opacity:1;transform:scale(1.1)}}

/* ===== 自定义地图标记 ===== */
.event-marker{border-radius:50%;border:2px solid;animation:pulse-marker 2s infinite}
.event-marker.red{background:rgba(255,61,61,0.6);border-color:#ff3d3d;box-shadow:0 0 12px rgba(255,61,61,0.5)}
.event-marker.orange{background:rgba(255,136,0,0.5);border-color:#ff8800;box-shadow:0 0 10px rgba(255,136,0,0.4)}
.event-marker.green{background:rgba(0,230,118,0.5);border-color:#00e676;box-shadow:0 0 8px rgba(0,230,118,0.4)}
.event-marker.yellow{background:rgba(255,204,0,0.5);border-color:#ffcc00;box-shadow:0 0 10px rgba(255,204,0,0.4)}
@keyframes pulse-marker{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:0.6}}
.dept-marker{border-radius:50%;background:rgba(176,96,255,0.5);border:1.5px solid #b060ff}
.officer-marker{border-radius:0;background:rgba(0,230,118,0.8);border:2px solid #00e676;clip-path:polygon(50% 0%,0% 100%,100% 100%)}
.camera-marker{border-radius:50%;background:rgba(0,180,255,0.5);border:1.5px solid #00b4ff}
.metro-station{border-radius:50%;background:rgba(0,212,255,0.7);border:2px solid #00d4ff;box-shadow:0 0 8px rgba(0,212,255,0.4);width:10px;height:10px}
.metro-station.crowded{background:rgba(255,136,0,0.7);border-color:#ff8800;box-shadow:0 0 8px rgba(255,136,0,0.4)}
.metro-station.heavy{background:rgba(255,61,61,0.7);border-color:#ff3d3d;box-shadow:0 0 8px rgba(255,61,61,0.4)}

/* ===== 底部时间线 ===== */
.bottom{position:absolute;bottom:0;left:0;right:0;z-index:1000;height:48px;background:linear-gradient(0deg,rgba(7,14,30,0.97),rgba(7,14,30,0.7),transparent);padding:8px 20px 10px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px}
.tl-label{font-size:11px;color:var(--cyan);font-weight:600;white-space:nowrap}
.tl-track{flex:1;height:3px;background:rgba(0,50,120,0.4);border-radius:2px;position:relative;cursor:pointer}
.tl-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:2px;width:35%;transition:width .3s}
.tl-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px rgba(0,180,255,0.5);left:35%;transition:left .3s}
.tl-time{font-family:var(--mono);font-size:12px;color:var(--cyan);min-width:50px;text-align:right}
.tl-btns{display:flex;gap:4px}
.tl-btn{width:24px;height:24px;border-radius:4px;border:1px solid var(--border);background:var(--card);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .2s}
.tl-btn:hover{border-color:var(--blue);color:var(--cyan)}
.tl-btn.active{background:rgba(0,80,180,0.3);border-color:var(--blue);color:var(--cyan)}

.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2000;background:rgba(8,16,36,0.96);border-radius:10px;padding:16px 28px;text-align:center;min-width:280px;box-shadow:0 0 30px rgba(0,0,0,0.3);display:none;animation:pop .3s ease-out}
.toast.show{display:block}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(0.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.toast-icon{font-size:28px;margin-bottom:6px}
.toast-title{font-size:14px;font-weight:700}
.toast-desc{font-size:12px;color:var(--t2);margin-top:4px}
.toast-time{font-size:10px;color:var(--t2);margin-top:4px}
.toast-border-city{border:1px solid var(--cyan)}.toast-border-city .toast-title{color:var(--cyan)}
.toast-border-emergency{border:1px solid var(--red)}.toast-border-emergency .toast-title{color:var(--red)}

/* ===== 功能面板通用 ===== */
.func-panel{width:440px;overflow:visible;border-left:1px solid var(--border);background:var(--panel);backdrop-filter:blur(12px);display:flex;flex-direction:column;z-index:500;padding:0;min-height:0}
.func-panel::-webkit-scrollbar{width:3px}
.func-panel::-webkit-scrollbar-thumb{background:rgba(0,80,180,0.3);border-radius:2px}
.fp-section{padding:14px 16px;border-bottom:1px solid var(--border)}
.fp-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.fp-title .fp-icon{font-size:16px}
.fp-desc{font-size:11px;color:var(--t2);line-height:1.7;margin-bottom:10px}
.fp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fp-card{padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all .25s;position:relative}
.fp-card:hover{border-color:var(--glow);background:rgba(0,80,180,0.08)}
.fp-card.active{border-color:var(--cyan);background:rgba(0,80,180,0.12)}
.fp-card-icon{font-size:18px;margin-bottom:4px}
.fp-card-name{font-size:11px;font-weight:700;color:var(--t1);margin-bottom:2px}
.fp-card-desc{font-size:9px;color:var(--t2);line-height:1.4}
.fp-card-status{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%}
.fp-card-status.on{background:var(--green);box-shadow:0 0 4px rgba(0,230,118,0.5)}
.fp-card-status.off{background:var(--t2)}
.fp-card-status.warn{background:var(--orange);box-shadow:0 0 4px rgba(255,136,0,0.5)}
.fp-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:11px}
.fp-row:last-child{border-bottom:none}
.fp-label{color:var(--t2);min-width:70px;font-size:10px}
.fp-value{color:var(--t1);font-weight:600;flex:1;font-size:11px}
.fp-tag{font-size:9px;padding:1px 6px;border-radius:3px;font-weight:600;white-space:nowrap}
.fp-btn{padding:5px 14px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .2s;border:1px solid}
.fp-btn:hover{box-shadow:0 0 8px rgba(0,100,255,0.15)}
.fp-btn-primary{border-color:var(--cyan);background:rgba(0,100,200,0.1);color:var(--cyan)}
.fp-btn-primary:hover{background:rgba(0,100,200,0.2)}
.fp-btn-danger{border-color:var(--red);background:rgba(255,60,60,0.08);color:var(--red)}
.fp-btn-danger:hover{background:rgba(255,60,60,0.15)}
.fp-btn-success{border-color:var(--green);background:rgba(0,230,118,0.08);color:var(--green)}
.fp-btn-warn{border-color:var(--orange);background:rgba(255,136,0,0.08);color:var(--orange)}
.fp-btn-group{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.fp-divider{height:1px;background:var(--border);margin:8px 0}
.fp-mini-chart{display:flex;align-items:flex-end;gap:2px;height:30px;margin-top:4px}
.fp-mini-bar{flex:1;border-radius:2px 2px 0 0;min-width:4px;transition:height .3s}
.fp-log-item{padding:6px 8px;border-radius:4px;background:rgba(0,0,0,0.15);margin-bottom:4px;font-size:10px;line-height:1.5}
.fp-log-time{color:var(--t2);font-family:var(--mono);font-size:9px}
.fp-log-text{color:var(--t1);margin-top:2px}
.fp-log-level{font-size:8px;padding:1px 4px;border-radius:2px;font-weight:600;display:inline-block;margin-left:4px}
.fp-log-info{background:rgba(0,153,255,0.15);color:var(--blue)}
.fp-log-warn{background:rgba(255,136,0,0.15);color:var(--orange)}
.fp-log-error{background:rgba(255,61,61,0.15);color:var(--red)}
.fp-log-ok{background:rgba(0,230,118,0.15);color:var(--green)}
.fp-timeline{position:relative;padding-left:16px}
.fp-timeline::before{content:'';position:absolute;left:5px;top:0;bottom:0;width:1px;background:var(--border)}
.fp-tl-node{position:relative;padding:6px 0 12px 12px}
.fp-tl-node::before{content:'';position:absolute;left:-14px;top:10px;width:8px;height:8px;border-radius:50%;border:2px solid var(--border);background:var(--bg)}
.fp-tl-node.active::before{border-color:var(--purple);background:var(--purple);box-shadow:0 0 6px rgba(176,96,255,0.4)}
.fp-tl-node.done::before{border-color:var(--green);background:var(--green)}
.fp-tl-time{font-size:9px;color:var(--t2);font-family:var(--mono)}
.fp-tl-text{font-size:11px;color:var(--t1);margin-top:2px}
.fp-tl-desc{font-size:10px;color:var(--t2);margin-top:2px;line-height:1.5}
.fp-slider{width:100%;-webkit-appearance:none;height:4px;border-radius:2px;background:rgba(0,50,120,0.4);outline:none;margin:6px 0}
.fp-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--cyan);cursor:pointer;box-shadow:0 0 6px rgba(0,180,255,0.4)}
.fp-select{padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:var(--card);color:var(--t1);font-size:11px;font-family:var(--font);outline:none;cursor:pointer}
.fp-select:focus{border-color:var(--cyan)}
.fp-input{padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:rgba(0,0,0,0.2);color:var(--t1);font-size:11px;font-family:var(--font);outline:none;width:100%}
.fp-input:focus{border-color:var(--cyan);box-shadow:0 0 8px rgba(0,180,255,0.1)}

/* ===== 模型Tooltip ===== */
.model-tooltip-wrap{position:relative;display:inline-flex;align-items:center;cursor:help}
.model-tooltip-wrap .tip-icon{width:14px;height:14px;border-radius:50%;background:rgba(176,96,255,0.15);color:var(--purple);font-size:9px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(176,96,255,0.3);margin-left:4px;font-weight:700}
.model-tooltip{display:none;position:absolute;bottom:calc(100% + 8px);right:0;background:rgba(8,16,36,0.97);border:1px solid var(--purple);border-radius:6px;padding:10px 14px;min-width:300px;max-width:360px;z-index:900;box-shadow:0 4px 20px rgba(0,0,0,0.4);backdrop-filter:blur(12px)}
.model-tooltip::after{content:'';position:absolute;top:100%;right:20px;border:6px solid transparent;border-top-color:var(--purple)}
.model-tooltip-wrap:hover .model-tooltip{display:block}
.model-tooltip .tip-title{font-size:12px;font-weight:700;color:var(--purple);margin-bottom:6px}
.model-tooltip .tip-row{font-size:10px;color:var(--t2);line-height:1.7;margin:2px 0}
.model-tooltip .tip-row b{color:var(--t1);font-weight:600}

/* ===== 预案文件模态框 ===== */
.plan-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:3000;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.plan-modal-overlay.show{display:flex}
.plan-modal{width:680px;max-height:80vh;background:var(--panel);border:1px solid var(--green);border-radius:10px;box-shadow:0 0 40px rgba(0,230,118,0.1);display:flex;flex-direction:column;animation:modalIn .3s ease-out}
@keyframes modalIn{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}
.plan-modal-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.plan-modal-header h3{font-size:15px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:8px;margin:0}
.plan-modal-close{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--t2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.plan-modal-close:hover{border-color:var(--red);color:var(--red);background:rgba(255,61,61,0.1)}
.plan-modal-body{flex:1;overflow-y:auto;padding:16px 20px}
.plan-modal-body::-webkit-scrollbar{width:3px}
.plan-modal-body::-webkit-scrollbar-thumb{background:rgba(0,80,180,0.3);border-radius:2px}
.plan-modal-meta{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.plan-modal-meta .meta-tag{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600}
.plan-section-title{font-size:12px;font-weight:700;color:var(--t1);margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.plan-article{padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:5px;margin-bottom:6px;border-left:3px solid var(--green)}
.plan-article-num{font-size:10px;font-weight:700;color:var(--green);margin-bottom:3px}
.plan-article-text{font-size:11px;color:var(--t2);line-height:1.7}

/* 预案文件图标按钮 */
.plan-file-btn{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;border:1px solid rgba(0,230,118,0.3);background:rgba(0,230,118,0.08);color:var(--green);font-size:9px;cursor:pointer;transition:all .2s;font-family:var(--font)}
.plan-file-btn:hover{background:rgba(0,230,118,0.15);border-color:var(--green)}

/* 推演联动按钮 */
.deduce-link-btn{padding:6px 14px;border-radius:5px;border:1px solid var(--red);background:rgba(255,60,60,0.08);color:var(--red);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .2s;display:flex;align-items:center;gap:6px}
.deduce-link-btn:hover{background:rgba(255,60,60,0.15);box-shadow:0 0 10px rgba(255,60,60,0.15)}

/* ===== 智能体详情模态框 ===== */
.agent-detail-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:3000;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.agent-detail-overlay.show{display:flex}
.agent-detail{width:600px;max-height:80vh;background:var(--panel);border:1px solid var(--cyan);border-radius:10px;box-shadow:0 0 40px rgba(0,153,255,0.1);display:flex;flex-direction:column;animation:modalIn .3s ease-out}
.agent-detail-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.agent-detail-header h3{font-size:15px;font-weight:700;color:var(--cyan);display:flex;align-items:center;gap:8px;margin:0}
.agent-detail-close{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--t2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.agent-detail-close:hover{border-color:var(--red);color:var(--red);background:rgba(255,61,61,0.1)}
.agent-detail-body{flex:1;overflow-y:auto;padding:16px 20px}
.agent-detail-body::-webkit-scrollbar{width:3px}
.agent-detail-body::-webkit-scrollbar-thumb{background:rgba(0,80,180,0.3);border-radius:2px}
.ad-status-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ad-status-tag{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600}
.ad-section{margin-bottom:14px}
.ad-section-title{font-size:12px;font-weight:700;color:var(--cyan);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.ad-react-step{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);align-items:flex-start}
.ad-react-step:last-child{border-bottom:none}
.ad-react-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.ad-react-icon.thought{background:rgba(176,96,255,0.2);color:var(--purple)}
.ad-react-icon.action{background:rgba(0,230,118,0.2);color:var(--green)}
.ad-react-icon.observation{background:rgba(0,153,255,0.2);color:var(--blue)}
.ad-react-content{flex:1}
.ad-react-title{font-size:11px;font-weight:700;color:var(--t1);margin-bottom:2px}
.ad-react-text{font-size:10px;color:var(--t2);line-height:1.6}
.ad-react-time{font-size:9px;color:var(--t2);font-family:var(--mono);margin-top:2px}
.ad-metric{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:11px}
.ad-metric-label{color:var(--t2)}
.ad-metric-value{color:var(--t1);font-weight:600;font-family:var(--mono)}

/* ===== 智能体面板内Tab ===== */
.agent-panel-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 12px}
.agent-panel-tab{padding:8px 16px;font-size:11px;font-weight:600;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;font-family:var(--font)}
.agent-panel-tab:hover{color:var(--t1)}
.agent-panel-tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.agent-panel-tab .tab-icon{margin-right:4px}
.agent-panel-back{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:11px;color:var(--t2);transition:color .2s}
.agent-panel-back:hover{color:var(--cyan)}
.agent-panel-back .back-arrow{font-size:14px}
.agent-panel-header{padding:10px 12px;border-bottom:1px solid var(--border)}
.agent-panel-header .aph-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.agent-panel-header .aph-icon{font-size:20px}
.agent-panel-header .aph-title{font-size:13px;font-weight:700;color:var(--t1)}
.agent-panel-header .aph-tags{display:flex;gap:8px;flex-wrap:wrap}
.agent-panel-header .aph-tag{font-size:9px;padding:2px 8px;border-radius:4px;font-weight:600}

/* 工作流程可视化 */
.wf-step{position:relative;padding:10px 0 10px 28px;border-left:2px solid var(--border)}
.wf-step:last-child{border-left-color:transparent}
.wf-step .wf-dot{position:absolute;left:-7px;top:12px;width:12px;height:12px;border-radius:50%;border:2px solid var(--panel)}
.wf-step .wf-dot.cyan{background:var(--cyan);box-shadow:0 0 8px rgba(0,212,255,0.4)}
.wf-step .wf-dot.purple{background:var(--purple);box-shadow:0 0 8px rgba(176,96,255,0.4)}
.wf-step .wf-dot.green{background:var(--green);box-shadow:0 0 8px rgba(0,230,118,0.4)}
.wf-step .wf-dot.orange{background:var(--orange);box-shadow:0 0 8px rgba(255,136,0,0.4)}
.wf-step .wf-dot.yellow{background:var(--yellow);box-shadow:0 0 8px rgba(255,204,0,0.4)}
.wf-step .wf-title{font-size:11px;font-weight:700;color:var(--t1);margin-bottom:3px}
.wf-step .wf-desc{font-size:10px;color:var(--t2);line-height:1.6}
.wf-step .wf-meta{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.wf-step .wf-meta-tag{font-size:8px;padding:1px 6px;border-radius:3px;background:rgba(255,255,255,0.06);color:var(--t2)}
.wf-section{padding:8px 12px;border-bottom:1px solid var(--border)}
.wf-section-title{font-size:11px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}

/* 面板内ReAct轨迹复用ad-react样式 */
.panel-react-step{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);align-items:flex-start}
.panel-react-step:last-child{border-bottom:none}
.panel-react-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.panel-react-icon.thought{background:rgba(176,96,255,0.2);color:var(--purple)}
.panel-react-icon.action{background:rgba(0,230,118,0.2);color:var(--green)}
.panel-react-icon.observation{background:rgba(0,153,255,0.2);color:var(--blue)}
.panel-react-content{flex:1;min-width:0}
.panel-react-title{font-size:10px;font-weight:700;color:var(--t1);margin-bottom:1px}
.panel-react-text{font-size:9px;color:var(--t2);line-height:1.5}
.panel-react-time{font-size:8px;color:var(--t2);font-family:var(--mono);margin-top:2px}

/* 面板内能力列表 */
.panel-cap-item{font-size:10px;color:var(--t2);line-height:1.6;padding:4px 0;padding-left:10px;border-left:2px solid var(--cyan);margin-bottom:3px}

/* 面板内指标 */
.panel-metric{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:10px}
.panel-metric:last-child{border-bottom:none}
.panel-metric-label{color:var(--t2)}
.panel-metric-value{color:var(--t1);font-weight:600;font-family:var(--mono)}

/* ===== 演示模式进度条 ===== */

.demo-progress-fill{height:100%;width:0%;transition:width 1s linear;border-radius:0 2px 2px 0}
.demo-progress-fill.phase-sense{background:var(--cyan)}
.demo-progress-fill.phase-deduce{background:var(--purple)}
.demo-progress-fill.phase-command{background:var(--orange)}
.demo-progress-fill.phase-review{background:var(--yellow)}
.demo-step-indicator{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:1500;padding:6px 16px;border-radius:0 0 8px 8px;font-size:11px;font-weight:600;display:none;backdrop-filter:blur(8px)}
.demo-step-indicator.show{display:flex;align-items:center;gap:8px}
.demo-step-indicator.phase-sense{background:rgba(0,212,255,0.15);color:var(--cyan);border:1px solid rgba(0,212,255,0.3);border-top:none}
.demo-step-indicator.phase-deduce{background:rgba(176,96,255,0.15);color:var(--purple);border:1px solid rgba(176,96,255,0.3);border-top:none}
.demo-step-indicator.phase-command{background:rgba(255,136,0,0.15);color:var(--orange);border:1px solid rgba(255,136,0,0.3);border-top:none}
.demo-step-indicator.phase-review{background:rgba(255,204,0,0.15);color:var(--yellow);border:1px solid rgba(255,204,0,0.3);border-top:none}

.review-report-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:3000;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}

.rr-tl-item{position:relative;padding:6px 0 6px 12px}
.rr-tl-item::before{content:'';position:absolute;left:-18px;top:12px;width:8px;height:8px;border-radius:50%;border:2px solid var(--yellow);background:var(--panel)}
.rr-tl-item.done::before{background:var(--yellow)}
.rr-tl-time{font-size:10px;color:var(--yellow);font-weight:600;font-family:var(--mono)}

.rr-tl-desc{font-size:10px;color:var(--t2);margin-top:1px}

.rr-metric-row{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.rr-metric-label{font-size:11px;color:var(--t2);min-width:120px}
.rr-metric-value{font-size:12px;font-weight:700;min-width:70px;text-align:center}
.rr-metric-target{font-size:10px;color:var(--t2);min-width:80px}
.rr-metric-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.rr-metric-bar-fill{height:100%;border-radius:3px;transition:width .5s ease-out}
.rr-damage-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:12px}
.rr-damage-area{font-size:11px;font-weight:700;color:var(--t1);min-width:70px}
.rr-damage-type{font-size:10px;color:var(--t2);min-width:70px}
.rr-damage-desc{font-size:10px;color:var(--t2);flex:1}
.rr-damage-level{font-size:9px;padding:2px 8px;border-radius:4px;font-weight:600}
.rr-lesson-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-bottom:6px;border-left:3px solid var(--yellow)}
.rr-lesson-title{font-size:11px;font-weight:700;color:var(--t1);margin-bottom:3px}
.rr-lesson-text{font-size:10px;color:var(--t2);line-height:1.5}
.rr-lesson-action{font-size:9px;color:var(--yellow);margin-top:4px;font-weight:600}
.rr-skill-step{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.rr-skill-num{width:22px;height:22px;border-radius:50%;background:rgba(255,204,0,0.15);color:var(--yellow);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rr-skill-title{font-size:11px;font-weight:600;color:var(--t1);min-width:80px}
.rr-skill-desc{font-size:10px;color:var(--t2);flex:1}

.rr-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.rr-btn{padding:8px 18px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--t2);transition:all .2s;font-family:var(--font)}
.rr-btn:hover{border-color:var(--yellow);color:var(--yellow)}
.rr-btn-primary{background:rgba(255,204,0,0.12);border-color:var(--yellow);color:var(--yellow)}

.rr-summary{background:var(--card);border:1px solid rgba(255,204,0,0.2);border-radius:6px;padding:12px 14px;font-size:11px;color:var(--t2);line-height:1.7;margin-bottom:14px}

</style>
</head>

function matchChat(text){
  const t = text.toLowerCase();
  // 领导高频问题
  if(t.includes('最紧急')||t.includes('最严重')||t.includes('什么情况')||t.includes('当前情况'))return'最紧急情况';
  if(t.includes('转移')&&(t.includes('多少')||t.includes('人')||t.includes('户')))return'转移了多少人';
  if(t.includes('水库')&&(t.includes('警戒')||t.includes('超')))return'水库超警戒';
  if(t.includes('调派')||t.includes('派了')||t.includes('哪些队伍')||t.includes('队伍'))return'调派了哪些队伍';
  if(t.includes('谁')&&(t.includes('批准')||t.includes('审批')||t.includes('启动')))return'谁批准响应';
  if(t.includes('回天')&&(t.includes('情况')||t.includes('如何')||t.includes('怎么样')))return'回天情况如何';
  if(t.includes('物资')&&(t.includes('够')||t.includes('储备')||t.includes('多少')))return'物资够不够';
  // 原有命令
  if(t.includes('推演')||t.includes('预测')||t.includes('未来'))return'态势推演';
  if(t.includes('应急')||t.includes('响应')||t.includes('启动'))return'应急响应';
  if(t.includes('回天')&&(t.includes('内涝')||t.includes('积水')||t.includes('排水')))return'回天内涝';
  if(t.includes('流村')||t.includes('暴雨'))return'流村暴雨';
  if(t.includes('水库')||t.includes('水位')||t.includes('十三陵'))return'水库水位';
  if(t.includes('安全')||t.includes('工地')||t.includes('危化')||t.includes('地下'))return'安全生产';
  if(t.includes('地质')||t.includes('滑坡')||t.includes('位移'))return'地质灾害';
  if(t.includes('南口')||t.includes('山洪'))return'南口山洪';
  return null;
}

function renderDispatchRoutes(){
  routeLayer.clearLayers();
  routePolylines=[];
  dispatchRoutes.forEach((r,idx)=>{
    const isDone=r.progress>=100;
    const isMoving=r.progress>0&&r.progress<100;
    const lineColor=isDone?'#00e676':isMoving?r.color:'#666';
    // 路线线条
    const pl=L.polyline(r.path,{color:lineColor,weight:4,opacity:0.8,dashArray:isDone?null:'10 6',lineCap:'round',lineJoin:'round'}).addTo(routeLayer)
      .bindPopup(`<div style="font-family:Microsoft YaHei;font-size:12px;color:#333;min-width:180px"><b>${r.icon} ${r.name}</b><br>路线：${r.from} → ${r.to}<br>经：${r.via}<br>距离：${r.dist} | 预计：${r.time}<br>状态：${r.status}（${r.progress}%）</div>`);
    routePolylines.push(pl);
    // 路线光晕
    L.polyline(r.path,{color:lineColor,weight:10,opacity:0.12,lineCap:'round',lineJoin:'round'}).addTo(routeLayer);
    // 起点
    const startIcon=L.divIcon({className:'',html:`<div style="width:12px;height:12px;border-radius:50%;background:${lineColor};border:2px solid #fff;box-shadow:0 0 6px ${lineColor}"></div>`,iconSize:[12,12],iconAnchor:[6,6]});
    L.marker(r.path[0],{icon:startIcon}).addTo(routeLayer).bindPopup(`<b>${r.icon} ${r.name}</b><br>起点：${r.from}`);
    // 终点
    const endIcon=L.divIcon({className:'',html:`<div style="width:14px;height:14px;border-radius:50%;background:${isDone?'#00e676':'#ff3d3d'};border:2px solid #fff;box-shadow:0 0 8px ${isDone?'#00e676':'#ff3d3d'}"></div>`,iconSize:[14,14],iconAnchor:[7,7]});
    L.marker(r.path[r.path.length-1],{icon:endIcon}).addTo(routeLayer).bindPopup(`<b>${r.icon} ${r.name}</b><br>终点：${r.to}`);
    // 行进中的队伍位置标记
    if(isMoving){
      const totalSegs=r.path.length-1;
      const segProgress=(r.progress/100)*totalSegs;
      const segIdx=Math.floor(segProgress);
      const segT=segProgress-segIdx;
      const pos=[r.path[segIdx][0]+(r.path[segIdx+1][0]-r.path[segIdx][0])*segT, r.path[segIdx][1]+(r.path[segIdx+1][1]-r.path[segIdx][1])*segT];
      const moveIcon=L.divIcon({className:'',html:`<div style="font-size:20px;filter:drop-shadow(0 0 4px ${r.color})">${r.icon}</div>`,iconSize:[24,24],iconAnchor:[12,12]});
      L.marker(pos,{icon:moveIcon}).addTo(routeLayer).bindPopup(`<b>${r.icon} ${r.name}</b><br>当前进度：${r.progress}%<br>状态：${r.status}`);
    }
  });
}

// ===== 车辆沿路线动画（executeAction触发）=====
window.animateVehicles=function(){
  // 确保路线图层显示
  if(!routeVisible){routeLayer.addTo(map);routeVisible=true;}
  // 清除旧的车辆标记
  vehicleMarkers.forEach(m=>{if(m&&m.remove)m.remove();});
  vehicleMarkers=[];
  // 为每条路线创建车辆标记并动画
  dispatchRoutes.forEach((r,idx)=>{
    if(r.progress>=100)return; // 已到达的跳过
    // 创建车辆标记
    const moveIcon=L.divIcon({className:'',html:`<div style="font-size:22px;filter:drop-shadow(0 0 6px ${r.color});transition:none">${r.icon}</div>`,iconSize:[28,28],iconAnchor:[14,14]});
    // 计算起始位置（基于当前progress）
    const startPos=getPositionOnPath(r.path,r.progress);
    const marker=L.marker(startPos,{icon:moveIcon}).addTo(routeLayer);
    marker.bindPopup(`<b>${r.icon} ${r.name}</b><br>正在执行中...<br>状态：行进中`);
    vehicleMarkers.push(marker);
    // 动画：从当前progress到100
    const startProgress=r.progress;
    const totalSteps=30;
    let step=0;
    const iv=setInterval(()=>{
      step++;
      const t=step/totalSteps;
      const prog=startProgress+(100-startProgress)*t;
      const pos=getPositionOnPath(r.path,prog);
      marker.setLatLng(pos);
      // 更新popup内容
      marker.setPopupContent(`<b>${r.icon} ${r.name}</b><br>进度：${Math.round(prog)}%<br>状态：行进中`);
      // 更新面板进度条（如果存在）
      updateRouteProgressInPanel(idx,prog);
      if(step>=totalSteps){
        clearInterval(iv);
        // 到达终点
        r.progress=100;
        r.status='已到达';
        marker.setPopupContent(`<b>${r.icon} ${r.name}</b><br>已到达目的地<br>状态：已到达`);
        // 更新面板状态
        updateRouteStatusInPanel(idx);
      }
    },100);
  });
};

// 根据progress百分比计算路径上的经纬度
function getPositionOnPath(path,progress){
  if(progress<=0)return path[0];
  if(progress>=100)return path[path.length-1];
  const totalSegs=path.length-1;
  const segProgress=(progress/100)*totalSegs;
  const segIdx=Math.floor(segProgress);
  const segT=segProgress-segIdx;
  return [
    path[segIdx][0]+(path[segIdx+1][0]-path[segIdx][0])*segT,
    path[segIdx][1]+(path[segIdx+1][1]-path[segIdx][1])*segT
  ];
}

  const bars=document.querySelectorAll('#panel-content .fp-section .route-progress-bar');

  const texts=document.querySelectorAll('#panel-content .fp-section .route-progress-text');
  if(texts[idx])texts[idx].textContent='进度'+Math.round(progress)+'%';
}

function renderAgentPanel(data){
  const el=document.getElementById('agent-panel');

  h+=`</div></div>`;
  if(currentAgent==='emergency'){
    // 预案依据卡片
    const evt=agentData.emergency.events[currentEventIdx]||agentData.emergency.events[0];
    const level=evt?evt.level:'III';
    const eActions=data.emergActions[currentEventIdx]||data.emergActions[0];
    h+=`<div class="plan-card">`;
    h+=`<div class="plan-card-header"><span class="plan-icon">📋</span>应急预案依据<span class="plan-level-tag plan-level-${level}">${level}级响应</span></div>`;
    h+=`<div class="plan-card-body">`;
    // 提取不重复的预案条款
    const seenRefs=new Set();
    eActions.forEach(a=>{
      if(a.ref&&!seenRefs.has(a.ref)){
        seenRefs.add(a.ref);
        const parts=a.ref.split(' ',2);
        const clause=parts[0]||'';
        const desc=parts[1]||'';
        h+=`<div class="plan-item"><span class="plan-clause">${clause}</span><span class="plan-desc">${desc}</span></div>`;
      }
    });
    h+=`</div></div>`;
    // 应急响应流程
    h+=`<div class="t-block t-response"><div class="t-title">● 应急响应流程（依据北京市总体预案）</div><div class="t-content" id="response-content">`;
    h+=`<div class="step"><span class="step-n" style="background:rgba(255,61,61,0.2);color:var(--red)">1</span><span>【信息接报】接收预警信息，按规定2小时内向市应急办报送</span></div>`;
    h+=`<div class="step"><span class="step-n" style="background:rgba(255,61,61,0.2);color:var(--red)">2</span><span>【先期处置】区政府立即组织先期处置，防止事态扩大</span></div>`;
    h+=`<div class="step"><span class="step-n" style="background:rgba(255,61,61,0.2);color:var(--red)">3</span><span>【分级响应】依据事件等级启动相应级别响应（IV/III/II/I级）</span></div>`;
    h+=`<div class="step"><span class="step-n" style="background:rgba(255,61,61,0.2);color:var(--red)">4</span><span>【现场指挥】建立现场指挥部，统一指挥处置</span></div>`;
    h+=`<div class="step"><span class="step-n" style="background:rgba(255,61,61,0.2);color:var(--red)">5</span><span>【处置措施】搜救转移+交通管控+医疗救治+物资保障</span></div>`;
    h+=`<div class="step"><span class="step-n" style="background:rgba(255,61,61,0.2);color:var(--red)">6</span><span>【响应结束】险情解除，终止响应，进入恢复重建</span></div>`;
    h+=`</div></div>`;

  if(data.collab){h+=`<div class="t-block t-collab"><div class="t-title">\u25cf 多部门协作链路</div><div class="t-content" id="collab-content">`;data.collab.forEach(c=>{h+=`<div class="collab-row"><span class="dept-badge ${c.fromCls}">${c.from}</span><span class="collab-arrow">\u2192</span><span class="collab-desc">${c.desc}</span><span class="collab-arrow">\u2192</span><span class="dept-badge ${c.toCls}">${c.to}</span></div>`;});h+=`</div></div>`;}
  h+=`<div class="t-block t-action"><div class="t-title">\u25cf 执行建议${currentAgent==='emergency'?'（依据预案生成，每步可修改+确认）':''}</div><div class="t-content" id="action-content">`;
  data.actions.forEach((a,i)=>{
    if(a.badge==='confirm'){
      h+=`<div class="act-row-wrap" id="act-wrap-${i}">`;
      h+=`<div class="act-row" id="act-text-${i}"><span>${a.text}</span></div>`;
      if(a.ref)h+=`<div class="act-ref">\ud83d\udccb ${a.ref}</div>`;
      h+=`<input class="act-edit-input" id="act-edit-${i}" value="${a.text.replace(/"/g,'&quot;')}"/>`;
      h+=`<div class="act-btns">`;
      h+=`<button class="act-btn act-btn-confirm" id="act-confirm-${i}" onclick="confirmStep(${i})">\u2713 确认</button>`;
      h+=`<button class="act-btn act-btn-modify" id="act-modify-${i}" onclick="modifyStep(${i})">\u270e 修改</button>`;
      h+=`</div></div>`;
    }else{
      const bc=a.badge==='auto'?'badge-auto':a.badge==='manual'?'badge-manual':'badge-pending',bt=a.badge==='auto'?'已授权':a.badge==='manual'?'需确认':'待确认';
      h+=`<div class="act-row"><span>${a.text}</span><span class="badge ${bc}">${bt}</span></div>`;
    }
  });
  h+=`</div></div>`;
  h+=`<button class="exec-btn ${data.btnCls}" id="exec-btn" onclick="executeAction()">${data.btnText}</button>`;
  el.innerHTML=h;
}

function renderMapMarkers(data){
  eventLayer.clearLayers();personnelLayer.clearLayers();cameraLayer.clearLayers();
  data.events.forEach(e=>{const sz=e.type==='red'?14:e.type==='orange'?12:10;const icon=L.divIcon({className:'',html:`<div class="event-marker ${e.type}" style="width:${sz}px;height:${sz}px"></div>`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});const m=L.marker([e.lat,e.lon],{icon}).addTo(eventLayer);m.bindPopup(`<div style="font-family:Microsoft YaHei;font-size:12px;color:#333;min-width:140px"><b>${e.label}</b><br>${e.desc}</div>`);m.on('click',()=>selectEventById(e.id));});
  const rel=currentAgent==='emergency'?personnelPoints.filter(p=>p.type!=='chenguan'):personnelPoints;
  rel.forEach(p=>{const icon=L.divIcon({className:'',html:`<div class="${p.type==='chenguan'?'officer-marker':'dept-marker'}" style="width:12px;height:12px"></div>`,iconSize:[12,12],iconAnchor:[6,12]});const m=L.marker([p.lat,p.lon],{icon}).addTo(personnelLayer);m.bindPopup(`<div style="font-family:Microsoft YaHei;font-size:12px;color:#333"><b>${p.label}</b><br>在线</div>`);});
  cameraPoints.forEach(c=>{const icon=L.divIcon({className:'',html:`<div class="camera-marker" style="width:6px;height:6px"></div>`,iconSize:[6,6],iconAnchor:[3,3]});L.marker([c.lat,c.lon],{icon}).addTo(cameraLayer);});
  createHeatCircles(data.events);
}
function createHeatCircles(events){heatLayer.clearLayers();events.forEach(p=>{if(p.type==='green')return;const r=p.type==='red'?600:p.type==='orange'?400:300,c=p.type==='red'?'#ff3d3d':p.type==='orange'?'#ff8800':'#ffcc00';L.circle([p.lat,p.lon],{radius:r,color:c,fillColor:c,fillOpacity:0.12,weight:1,opacity:0.35}).addTo(heatLayer);});}

function selectEventById(id){const d=getActiveData();if(!d)return;const idx=d.events.findIndex(e=>e.id===id);if(idx<0)return;currentEventIdx=idx;const t=d.theme;document.querySelectorAll('.event-item').forEach(e=>e.className='event-item');const items=document.querySelectorAll('.event-item');if(items[idx])items[idx].classList.add('active-'+t);flyToEvent(idx);updateAgentForEvent(idx);}

function updateAgentForEvent(idx){
  const d=getActiveData(),thinkEl=document.getElementById('think-content');
  const actionEl=document.getElementById('action-content');
  if(!thinkEl||!actionEl)return;
  let thinks,actions;
  if(d.emergThinks){thinks=d.emergThinks[idx]||d.emergThinks[0];actions=d.emergActions[idx]||d.emergActions[0];}
  else if(d.cityThinks){thinks=d.cityThinks[idx]||d.cityThinks[0];actions=d.cityActions[idx]||d.cityActions[0];}
  else{thinks=d.think||[];actions=[];}
  thinkEl.innerHTML=thinks.map((t,i)=>`<div class="step"><span class="step-n">${i+1}</span><span>${t}</span></div>`).join('');
  actionEl.innerHTML=actions.map((a,i)=>{
    if(a.badge==='confirm'){
      let h=`<div class="act-row-wrap" id="act-wrap-${i}">`;
      h+=`<div class="act-row" id="act-text-${i}"><span>${a.text}</span></div>`;
      if(a.ref)h+=`<div class="act-ref">\ud83d\udccb ${a.ref}</div>`;
      h+=`<input class="act-edit-input" id="act-edit-${i}" value="${a.text.replace(/"/g,'&quot;')}"/>`;
      h+=`<div class="act-btns">`;
      h+=`<button class="act-btn act-btn-confirm" id="act-confirm-${i}" onclick="confirmStep(${i})">\u2713 确认</button>`;
      h+=`<button class="act-btn act-btn-modify" id="act-modify-${i}" onclick="modifyStep(${i})">\u270e 修改</button>`;
      h+=`</div></div>`;
      return h;
    }
    const bc=a.badge==='auto'?'badge-auto':a.badge==='manual'?'badge-manual':'badge-pending',bt=a.badge==='auto'?'已授权':a.badge==='manual'?'需确认':'待确认';
    return`<div class="act-row"><span>${a.text}</span><span class="badge ${bc}">${bt}</span></div>`;
  }).join('');
  // 同步更新预案依据卡片
  if(currentAgent==='emergency'){
    const evt=d.events[idx]||d.events[0];
    const level=evt?evt.level:'III';
    const eActions=d.emergActions[idx]||d.emergActions[0];
    const planCard=document.querySelector('.plan-card');
    if(planCard){
      let ph=`<div class="plan-card-header"><span class="plan-icon">\ud83d\udccb</span>应急预案依据<span class="plan-level-tag plan-level-${level}">${level}\u7ea7\u54cd\u5e94</span></div>`;
      ph+=`<div class="plan-card-body">`;
      const seenRefs=new Set();
      eActions.forEach(a=>{
        if(a.ref&&!seenRefs.has(a.ref)){
          seenRefs.add(a.ref);
          const parts=a.ref.split(' ',2);
          const clause=parts[0]||'';
          const desc=parts[1]||'';
          ph+=`<div class="plan-item"><span class="plan-clause">${clause}</span><span class="plan-desc">${desc}</span></div>`;
        }
      });
      ph+=`</div>`;
      planCard.innerHTML=ph;
    }
  }
}

window.confirmStep=function(i){
  const btn=document.getElementById('act-confirm-'+i);
  const wrap=document.getElementById('act-wrap-'+i);
  const modifyBtn=document.getElementById('act-modify-'+i);
  if(!btn||btn.classList.contains('confirmed'))return;
  btn.classList.add('confirmed');
  btn.textContent='已确认 ✓';
  btn.onclick=null;
  if(modifyBtn){modifyBtn.style.display='none';}
  if(wrap){wrap.style.opacity='0.7';wrap.style.borderLeft='3px solid var(--green)';wrap.style.paddingLeft='6px';}
  // 检查是否所有步骤都已确认
  setTimeout(()=>{
    const all=document.querySelectorAll('#action-content .act-btn-confirm:not(.confirmed)');
    if(all.length===0){
      const execBtn=document.getElementById('exec-btn');
      if(execBtn){
        execBtn.textContent=(currentAgent==='command'||currentAgent==='emergency')?'启动应急响应方案':'启动全域态势研判与调度';
        execBtn.style.opacity='1';
        execBtn.style.pointerEvents='auto';
      }
    }
  },100);
};

window.modifyStep=function(i){
  const textEl=document.getElementById('act-text-'+i);
  const editEl=document.getElementById('act-edit-'+i);
  const btn=document.getElementById('act-modify-'+i);
  const confirmBtn=document.getElementById('act-confirm-'+i);
  if(!textEl||!editEl)return;
  // 切换编辑状态
  if(editEl.style.display==='block'){
    // 保存修改
    const newText=editEl.value.trim()||textEl.querySelector('span').textContent;
    textEl.querySelector('span').textContent=newText;
    editEl.style.display='none';
    textEl.style.display='flex';
    btn.textContent='\u270e 修改';
    btn.classList.remove('editing');
  }else{
    // 进入编辑
    editEl.value=textEl.querySelector('span').textContent;
    editEl.style.display='block';
    textEl.style.display='none';
    editEl.focus();
    btn.textContent='\u2713 保存';
    btn.classList.add('editing');
  }
};

// ===== 时间轴联动暴雨推演 =====
// 时间轴：6:00(0) ~ 20:00(1)，暴雨关键时间点
// 14:00前：无暴雨影响；14:00开始暴雨；14:30黄色预警；15:30暴雨东移；16:30超警戒；18:30渐弱
function updateRainOnTimeline(){
  if(!predictVisible)return;
  const hour=tlP*14+6; // 当前小时（小数）
  predictLayer.clearLayers();
  // 推演参数影响系数
  const rainFactor=typeof deduceRainIntensity!=='undefined'?deduceRainIntensity/72:1;
  // 根据时间计算暴雨参数
  let rainLevel=0; // 0=无,1=小雨,2=中雨,3=暴雨,4=大暴雨
  let rainCenter=[40.30,116.05]; // 暴雨中心（流村）
  let rainRadius=0; // 暴雨影响半径（经度跨度）
  let rainMM=0; // 累计降雨
  let waterlogLevel=0; // 内涝程度
  let damLevel=92.3; // 水库水位
  let geoRiskCount=3; // 地质灾害点数

  if(hour<14){rainLevel=0;}
  else if(hour<14.5){rainLevel=1;rainMM=Math.round(30*rainFactor);rainRadius=0.04;waterlogLevel=0.3*rainFactor;}
  else if(hour<15.5){
    rainLevel=2;rainCenter=[40.29,116.07];rainMM=Math.round(85*rainFactor);rainRadius=0.08;waterlogLevel=0.5*rainFactor;
    // 显示黄色预警标注
    const warnIcon=L.divIcon({className:'',html:'<div style="background:rgba(255,204,0,0.9);color:#333;font-size:9px;padding:2px 6px;border-radius:3px;white-space:nowrap;font-family:Microsoft YaHei;font-weight:600">暴雨黄色预警</div>',iconSize:[80,18],iconAnchor:[40,9]});
    L.marker([40.30,116.05],{icon:warnIcon}).addTo(predictLayer);
  }else if(hour<16.5){
    rainLevel=3;rainCenter=[40.27,116.12];rainMM=Math.round(100*rainFactor);rainRadius=0.12;waterlogLevel=0.7*rainFactor;damLevel=92.3+1.8*rainFactor;geoRiskCount=3+Math.floor(2*rainFactor);
    // 暴雨中心标注
    const rainIcon=L.divIcon({className:'',html:'<div style="background:rgba(176,96,255,0.9);color:#fff;font-size:9px;padding:2px 6px;border-radius:3px;white-space:nowrap;font-family:Microsoft YaHei;font-weight:600">暴雨中心 '+rainMM+'mm</div>',iconSize:[80,18],iconAnchor:[40,9]});
    L.marker(rainCenter,{icon:rainIcon}).addTo(predictLayer);
  }else if(hour<18){
    rainLevel=4;rainCenter=[40.24,116.18];rainMM=Math.round(120*rainFactor);rainRadius=0.16*rainFactor;waterlogLevel=Math.min(1,1*rainFactor);damLevel=92.3+2.9*rainFactor;geoRiskCount=3+Math.floor(4*rainFactor);
    const rainIcon=L.divIcon({className:'',html:'<div style="background:rgba(255,61,61,0.9);color:#fff;font-size:9px;padding:2px 6px;border-radius:3px;white-space:nowrap;font-family:Microsoft YaHei;font-weight:600">暴雨中心 '+rainMM+'mm</div>',iconSize:[80,18],iconAnchor:[40,9]});
    L.marker(rainCenter,{icon:rainIcon}).addTo(predictLayer);
  }else{
    rainLevel=3;rainCenter=[40.22,116.22];rainMM=Math.round(150*rainFactor);rainRadius=0.14*rainFactor;waterlogLevel=Math.min(1,0.8*rainFactor);damLevel=92.3+4.2*rainFactor;geoRiskCount=3+Math.floor(4*rainFactor);
    const rainIcon=L.divIcon({className:'',html:'<div style="background:rgba(176,96,255,0.9);color:#fff;font-size:9px;padding:2px 6px;border-radius:3px;white-space:nowrap;font-family:Microsoft YaHei;font-weight:600">降雨渐弱 '+rainMM+'mm</div>',iconSize:[80,18],iconAnchor:[40,9]});
    L.marker(rainCenter,{icon:rainIcon}).addTo(predictLayer);
  }

  if(rainLevel>0){
    // 暴雨扩散多边形（中心+半径，随时间扩展）
    const rc=rainCenter,rr=rainRadius;
    const poly=[];
    for(let a=0;a<360;a+=20){
      const rad=a*Math.PI/180;
      const wobble=1+0.15*Math.sin(a*3); // 不规则形状
      poly.push([rc[0]+rr*wobble*Math.cos(rad)*1.4, rc[1]+rr*wobble*Math.sin(rad)]);
    }
    const rainColor=rainLevel<=2?'#b060ff':rainLevel===3?'#9933ff':'#ff3d3d';
    const rainFill=rainLevel<=2?0.06:rainLevel===3?0.08:0.10;
    L.polygon(poly,{color:rainColor,fillColor:rainColor,fillOpacity:rainFill,weight:1.5,opacity:0.5,dashArray:'6 4'}).addTo(predictLayer)
      .bindPopup('<div style="font-family:Microsoft YaHei;font-size:12px;color:#333"><b>暴雨影响区</b><br>累计降雨：'+rainMM+'mm<br>影响范围持续扩大</div>');
  }

  // 内涝区域（14:30后出现，逐渐加重）
  if(waterlogLevel>0){
    const wl=waterlogLevel;
    const htPts=[[40.085,116.295],[40.085,116.355],[40.060,116.355],[40.060,116.295]];
    const htFill=wl<=0.5?0.06:wl<=0.8?0.10:0.14;
    const htColor=wl<=0.5?'#ffcc00':wl<=0.8?'#ff8800':'#ff3d3d';
    L.polygon(htPts,{color:htColor,fillColor:htColor,fillOpacity:htFill,weight:1,opacity:0.6,dashArray:'4 3'}).addTo(predictLayer)
      .bindPopup('<div style="font-family:Microsoft YaHei;font-size:12px;color:#333"><b>回天地区内涝风险</b><br>管网负荷：'+(wl*100).toFixed(0)+'%<br>积水深度：'+(wl*30).toFixed(0)+'cm</div>');
    if(wl>=0.7){
      L.divIcon&&L.marker([40.073,116.325],{icon:L.divIcon({className:'',html:'<div style="background:rgba(255,136,0,0.9);color:#fff;font-size:9px;padding:2px 6px;border-radius:3px;white-space:nowrap;font-family:Microsoft YaHei;font-weight:600">内涝风险 '+(wl*30).toFixed(0)+'cm</div>',iconSize:[85,18],iconAnchor:[42,9]})}).addTo(predictLayer);
      // 昌平城区内涝（15:30后）
      const cpPts=[[40.210,116.220],[40.230,116.220],[40.230,116.250],[40.210,116.250]];
      L.polygon(cpPts,{color:'#ff8800',fillColor:'#ff8800',fillOpacity:0.08,weight:1,opacity:0.6,dashArray:'4 3'}).addTo(predictLayer)
        .bindPopup('<div style="font-family:Microsoft YaHei;font-size:12px;color:#333"><b>昌平城区内涝风险</b><br>排水管网负荷达'+(wl*100).toFixed(0)+'%</div>');
    }
  }

  // 水库泄洪（15:30后水位上涨）
  if(damLevel>93){
    const damIcon=L.divIcon({className:'',html:'<div style="background:rgba(0,153,255,0.9);color:#fff;font-size:9px;padding:2px 6px;border-radius:3px;white-space:nowrap;font-family:Microsoft YaHei;font-weight:600">水位 '+damLevel.toFixed(1)+'m'+(damLevel>=95?' 超警戒':'')+'</div>',iconSize:[95,18],iconAnchor:[47,9]});
    L.marker([40.26,116.20],{icon:damIcon}).addTo(predictLayer);
    // 泄洪影响区（16:30后）
    if(damLevel>=94){
      const floodScale=(damLevel-94)/3; // 0~1
      const floodPoly=[
        [40.27,116.18],[40.26,116.22],[40.22,116.26],[40.18,116.28],
        [40.15,116.28],[40.15,116.26],[40.18,116.24],[40.22,116.22],
        [40.24,116.20],[40.26,116.18]
      ];
      L.polygon(floodPoly,{color:'#0099ff',fillColor:'#0099ff',fillOpacity:0.04+floodScale*0.04,weight:1.5,opacity:0.4,dashArray:'6 4'}).addTo(predictLayer)
        .bindPopup('<div style="font-family:Microsoft YaHei;font-size:12px;color:#333"><b>水库泄洪影响区</b><br>十三陵水库水位：'+damLevel.toFixed(1)+'m<br>泄洪量：'+(100+(damLevel-92)*12.5).toFixed(0)+'m\u00b3/s</div>');
    }
  }

  // 地质灾害风险带（14:30后）
  if(geoRiskCount>3){
    const geoLine=[[40.30,116.05],[40.28,116.08],[40.26,116.12],[40.25,116.15],[40.26,116.20]];
    L.polyline(geoLine,{color:'#ff3d3d',weight:2,opacity:0.5,dashArray:'8 6'}).addTo(predictLayer)
      .bindPopup('<div style="font-family:Microsoft YaHei;font-size:12px;color:#333"><b>地质灾害高风险带</b><br>风险点：'+geoRiskCount+'处</div>');
    // 风险点
    const pts=[{lat:40.28,lon:116.08,t:'A'},{lat:40.26,lon:116.12,t:'B'},{lat:40.25,lon:116.15,t:'C'},{lat:40.26,lon:116.20,t:'D'}];
    const showCount=Math.min(pts.length,geoRiskCount-3);
    for(let i=0;i<showCount;i++){
      L.circleMarker([pts[i].lat,pts[i].lon],{radius:4,color:'#ff3d3d',fillColor:'#ff3d3d',fillOpacity:0.5,weight:1}).addTo(predictLayer);
    }
  }

  // 转移路线（16:30后，暴雨中心东扩）
  if(rainLevel>=4){
    L.polyline([[40.30,116.05],[40.22,116.24]],{color:'#00e676',weight:2,opacity:0.4,dashArray:'10 6'}).addTo(predictLayer);
    L.polyline([[40.25,116.10],[40.22,116.24]],{color:'#00e676',weight:2,opacity:0.4,dashArray:'10 6'}).addTo(predictLayer);
    L.circleMarker([40.22,116.24],{radius:5,color:'#00e676',fillColor:'#00e676',fillOpacity:0.3,weight:2}).addTo(predictLayer);
    const evacIcon=L.divIcon({className:'',html:'<div style="background:rgba(0,230,118,0.8);color:#fff;font-size:8px;padding:1px 4px;border-radius:2px;white-space:nowrap;font-family:Microsoft YaHei">安置点</div>',iconSize:[40,16],iconAnchor:[20,8]});
    L.marker([40.22,116.24],{icon:evacIcon}).addTo(predictLayer);
  }
}

  const origTlP=tlP;
  tlP=(hour-6)/14;
  predictLayer.clearLayers();
  updateRainOnTimeline();
  map.setView([40.22,116.16],12);
};
