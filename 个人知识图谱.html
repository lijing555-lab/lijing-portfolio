<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人知识图谱 - F盘资料整理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:#0d1117;color:#c9d1d9;overflow:hidden;height:100vh;display:flex}

/* ===== LEFT NAV ===== */
#nav{width:280px;min-width:280px;height:100vh;background:#161b22;border-right:1px solid #21262d;display:flex;flex-direction:column;z-index:200}
#nav-header{padding:18px 20px 14px;border-bottom:1px solid #21262d}
#nav-header h1{font-size:16px;color:#4A7C59;font-weight:600;letter-spacing:1px}
#nav-header p{font-size:11px;color:#484f58;margin-top:4px}
#nav-search{padding:10px 16px;border-bottom:1px solid #21262d}
#nav-search input{width:100%;padding:7px 12px;background:#0d1117;border:1px solid #21262d;border-radius:6px;color:#c9d1d9;font-size:12px;outline:none}
#nav-search input:focus{border-color:#4A7C59}
#nav-search input::placeholder{color:#484f58}
#nav-tree{flex:1;overflow-y:auto;padding:8px 0}
#nav-tree::-webkit-scrollbar{width:4px}
#nav-tree::-webkit-scrollbar-thumb{background:#21262d;border-radius:2px}
.nav-group{margin-bottom:2px}
.nav-group-title{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:12px;font-weight:600;color:#8b949e;cursor:pointer;user-select:none;letter-spacing:0.5px;text-transform:uppercase}
.nav-group-title:hover{color:#c9d1d9}
.nav-group-title .arrow{font-size:10px;transition:transform .2s;color:#484f58}
.nav-group-title .arrow.collapsed{transform:rotate(-90deg)}
.nav-group-title .cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.nav-children{overflow:hidden;transition:max-height .3s ease}
.nav-children.collapsed{max-height:0!important}
.nav-item{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 38px;font-size:13px;color:#8b949e;cursor:pointer;transition:all .15s;border-left:2px solid transparent}
.nav-item:hover{color:#c9d1d9;background:rgba(74,124,89,0.06)}
.nav-item.active{color:#e6edf3;background:rgba(74,124,89,0.1);border-left-color:#4A7C59}
.nav-item .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.nav-item .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .badge{font-size:10px;color:#484f58;background:#21262d;padding:1px 6px;border-radius:8px}

/* ===== VIEW SWITCH ===== */
#view-tabs{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:0;background:#161b22;border:1px solid #21262d;border-radius:8px;overflow:hidden;z-index:100}
.view-tab{padding:7px 18px;font-size:12px;color:#8b949e;cursor:pointer;transition:all .15s;border:none;background:none}
.view-tab:hover{color:#c9d1d9}
.view-tab.active{color:#e6edf3;background:#4A7C59}

/* ===== MAIN CONTENT ===== */
#main{flex:1;position:relative;overflow:hidden}
#graph-canvas{display:block;width:100%;height:100%}

/* ===== ARCHITECTURE VIEW ===== */
#arch-view{display:none;width:100%;height:100%;overflow:auto;padding:30px 40px}
#arch-view::-webkit-scrollbar{width:6px;height:6px}
#arch-view::-webkit-scrollbar-thumb{background:#21262d;border-radius:3px}
.arch-section{margin-bottom:28px}
.arch-section-title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #21262d}
.arch-section-title .icon{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.arch-cards{display:flex;flex-wrap:wrap;gap:12px}
.arch-card{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:14px 18px;width:calc(50% - 6px);cursor:pointer;transition:all .2s;position:relative}
.arch-card:hover{border-color:#4A7C59;background:#1c2333;transform:translateY(-1px)}
.arch-card.active{border-color:#4A7C59;background:rgba(74,124,89,0.08)}
.arch-card h3{font-size:14px;color:#e6edf3;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.arch-card h3 .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.arch-card .desc{font-size:12px;color:#8b949e;line-height:1.6;margin-bottom:8px}
.arch-card .kws{display:flex;flex-wrap:wrap;gap:4px}
.arch-card .kw{font-size:10px;color:#7CB893;background:rgba(74,124,89,0.12);padding:2px 8px;border-radius:10px;border:1px solid rgba(74,124,89,0.2)}
.arch-card .rel-badge{position:absolute;top:10px;right:12px;font-size:10px;color:#484f58;background:#21262d;padding:2px 8px;border-radius:8px}
.arch-sub-cards{margin-top:12px;padding-left:20px;border-left:2px solid #21262d}
.arch-sub-card{background:#0d1117;border:1px solid #1b2028;border-radius:6px;padding:10px 14px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.arch-sub-card:hover{border-color:#4A7C59;background:#161b22}
.arch-sub-card h4{font-size:13px;color:#c9d1d9;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.arch-sub-card h4 .dot{width:6px;height:6px;border-radius:50%}
.arch-sub-card .desc{font-size:11px;color:#6e7681;line-height:1.5}

/* ===== RELATIONSHIP MAP ===== */
.rel-map{background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:20px;margin-bottom:28px}
.rel-map h3{font-size:14px;color:#e6edf3;margin-bottom:14px}
.rel-row{display:flex;align-items:center;gap:6px;padding:5px 0;font-size:12px}
.rel-from{color:#4A7C59;font-weight:500;min-width:120px;text-align:right}
.rel-arrow{color:#484f58;font-size:13px}
.rel-type{color:#D4A843;font-size:11px;background:rgba(212,168,67,0.1);padding:1px 8px;border-radius:8px}
.rel-arrow2{color:#484f58;font-size:13px}
.rel-to{color:#6BA3D6;font-weight:500;min-width:120px}

/* ===== DETAIL PANEL ===== */
#detail{position:fixed;right:0;top:0;width:420px;height:100vh;background:#161b22;border-left:1px solid #21262d;padding:0;overflow-y:auto;transform:translateX(100%);transition:transform .3s ease;z-index:300;box-shadow:-4px 0 20px rgba(0,0,0,0.3)}
#detail.open{transform:translateX(0)}
#detail-header{position:sticky;top:0;background:#161b22;padding:20px 24px 16px;border-bottom:1px solid #21262d;z-index:1}
#detail-close{position:absolute;top:14px;right:16px;background:none;border:none;color:#8b949e;font-size:18px;cursor:pointer;line-height:1}
#detail-close:hover{color:#e6edf3}
#detail-header h2{font-size:18px;color:#e6edf3;margin-bottom:4px}
#detail-header .category{font-size:11px;color:#484f58}
#detail-body{padding:20px 24px}
.d-section{margin-bottom:18px}
.d-section-title{font-size:11px;color:#484f58;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600}
.d-desc{font-size:13px;color:#8b949e;line-height:1.8}
.d-kws{display:flex;flex-wrap:wrap;gap:5px}
.d-kw{font-size:11px;color:#7CB893;background:rgba(74,124,89,0.12);padding:3px 10px;border-radius:12px;border:1px solid rgba(74,124,89,0.2)}
.d-list-item{padding:4px 0 4px 12px;border-left:2px solid #21262d;font-size:12px;color:#8b949e;line-height:1.6;cursor:default}
.d-list-item:hover{border-left-color:#4A7C59;color:#c9d1d9}
.d-rel-item{display:inline-flex;align-items:center;gap:4px;background:#0d1117;border:1px solid #21262d;color:#6BA3D6;padding:4px 12px;border-radius:16px;font-size:12px;margin:3px;cursor:pointer;transition:all .15s}
.d-rel-item:hover{border-color:#6BA3D6;background:rgba(107,163,214,0.08)}
.d-rel-item .rel-type{font-size:10px;color:#D4A843}

/* ===== STATS BAR ===== */
#stats-bar{position:absolute;bottom:0;left:0;right:0;padding:8px 20px;background:rgba(13,17,23,0.9);border-top:1px solid #21262d;display:flex;gap:20px;font-size:11px;color:#484f58;z-index:50}
#stats-bar span b{color:#8b949e}
</style>
</head>

const catIcons = {"核心领域":"◆","项目实践":"▶","知识储备":"■","学术研究":"●","个人档案":"★"};

function buildNavTree() {
  const tree = document.getElementById('nav-tree');
  tree.innerHTML = '';
  categories.forEach(cat => {
    const items = KG.domains.filter(d => d.category === cat && !d.parent);
    const children = KG.domains.filter(d => d.category === cat && d.parent);
    if (items.length === 0) return;
    const group = document.createElement('div');
    group.className = 'nav-group';
    const title = document.createElement('div');
    title.className = 'nav-group-title';
    title.innerHTML = `<span class="cat-dot" style="background:${catColors[cat]}"></span><span style="flex:1">${cat}</span><span class="arrow">▼</span>`;
    group.appendChild(title);
    const childContainer = document.createElement('div');
    childContainer.className = 'nav-children';
    childContainer.style.maxHeight = '1000px';
    items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'nav-item';
      el.dataset.id = item.id;
      el.innerHTML = `<span class="dot" style="background:${colorMap[item.id]}"></span><span class="label">${item.name}</span><span class="badge">${item.key_files.length}</span>`;
      el.onclick = () => selectDomain(item.id);
      childContainer.appendChild(el);
      // sub-items
      const subs = children.filter(c => c.parent === item.id);
      subs.forEach(sub => {
        const sel = document.createElement('div');
        sel.className = 'nav-item';
        sel.dataset.id = sub.id;
        sel.style.paddingLeft = '54px';
        sel.innerHTML = `<span class="dot" style="background:${colorMap[sub.id]}"></span><span class="label">${sub.name}</span><span class="badge">${sub.key_files.length}</span>`;
        sel.onclick = () => selectDomain(sub.id);
        childContainer.appendChild(sel);
      });
    });
    group.appendChild(childContainer);
    tree.appendChild(group);
    title.onclick = () => {
      const arrow = title.querySelector('.arrow');
      arrow.classList.toggle('collapsed');
      childContainer.classList.toggle('collapsed');
    };
  });
}
buildNavTree();

let activeId = null;

function selectDomain(id) {
  activeId = id;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
  const domain = nodeMap[id];
  if (domain) {
    showDetail(domain);
    if (currentView === 'graph') {
      selectedGraphNode = graphNodes.find(n => n.id === id) || null;
    }
  }
}

// ===== DETAIL PANEL =====
function showDetail(d) {
  const panel = document.getElementById('detail');
  const relEdges = KG.relationships.filter(r => r.from === d.id || r.to === d.id);
  document.getElementById('detail-title').textContent = d.name;
  document.getElementById('detail-cat').textContent = d.category + (d.parent ? ' > ' + nodeMap[d.parent].name : '');
  const body = document.getElementById('detail-body');
  body.innerHTML = `
    <div class="d-section"><div class="d-section-title">描述</div><div class="d-desc">${d.description}</div></div>
    <div class="d-section"><div class="d-section-title">关键词</div><div class="d-kws">${d.keywords.map(k=>`<span class="d-kw">${k}</span>`).join('')}</div></div>
    <div class="d-section"><div class="d-section-title">来源目录</div>${d.source_folders.map(f=>`<div class="d-list-item">${f}</div>`).join('')}</div>
    <div class="d-section"><div class="d-section-title">关键文件 (${d.key_files.length})</div>${d.key_files.map(f=>`<div class="d-list-item">${f}</div>`).join('')}</div>
    <div class="d-section"><div class="d-section-title">关联领域 (${relEdges.length})</div><div>${relEdges.map(e => {
      const other = e.from === d.id ? e.to : e.from;
      const otherD = nodeMap[other];
      return `<span class="d-rel-item" onclick="selectDomain('${other}')"><span style="color:${colorMap[other]}">●</span> ${otherD?otherD.name:other} <span class="rel-type">${e.type}</span></span>`;
    }).join('')}</div></div>
  `;
  panel.classList.add('open');
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
  activeId = null;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  selectedGraphNode = null;
}

// ===== SEARCH =====
document.getElementById('globalSearch').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll('.nav-item').forEach(el => {
    const id = el.dataset.id;
    const d = nodeMap[id];
    if (!d) return;
    const match = !q || d.name.toLowerCase().includes(q) || d.keywords.some(k=>k.toLowerCase().includes(q)) || d.key_files.some(f=>f.toLowerCase().includes(q));
    el.style.display = match ? '' : 'none';
  });
  // expand all groups when searching
  if (q) {
    document.querySelectorAll('.nav-children').forEach(c => c.classList.remove('collapsed'));
    document.querySelectorAll('.nav-group-title .arrow').forEach(a => a.classList.remove('collapsed'));
  }
});

// ===== GRAPH VIEW =====
const canvas = document.getElementById('graph-canvas');
const ctx = canvas.getContext('2d');
let W, H;
let graphNodes = [];
let selectedGraphNode = null;

function resizeCanvas() {
  const main = document.getElementById('main');
  W = canvas.width = main.clientWidth;
  H = canvas.height = main.clientHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function initGraphNodes() {
  graphNodes = KG.domains.map((d, i) => {
    const angle = (i / KG.domains.length) * Math.PI * 2 - Math.PI / 2;
    const r = Math.min(W, H) * 0.3;
    return {
      ...d, x: W/2 + Math.cos(angle)*r + (Math.random()-.5)*40,
      y: H/2 + Math.sin(angle)*r + (Math.random()-.5)*40,
      vx:0, vy:0,
      radius: d.parent ? 16 : 26,
      color: colorMap[d.id]
    };
  });
}
initGraphNodes();

const graphNodeMap = {};
graphNodes.forEach(n => graphNodeMap[n.id] = n);
const graphEdges = KG.relationships.filter(r=>graphNodeMap[r.from]&&graphNodeMap[r.to]).map(r=>({
  source:graphNodeMap[r.from],target:graphNodeMap[r.to],type:r.type,desc:r.description
}));

let gHovered = null, gDragging = null;

function forceStep() {
  for(let i=0;i<graphNodes.length;i++){
    for(let j=i+1;j<graphNodes.length;j++){
      let dx=graphNodes[j].x-graphNodes[i].x, dy=graphNodes[j].y-graphNodes[i].y;
      let dist=Math.sqrt(dx*dx+dy*dy)||1;
      let force=(180-dist)*0.002;
      if(dist<90)force-=0.4;
      graphNodes[i].vx-=(dx/dist)*force; graphNodes[i].vy-=(dy/dist)*force;
      graphNodes[j].vx+=(dx/dist)*force; graphNodes[j].vy+=(dy/dist)*force;
    }
  }
  graphEdges.forEach(e=>{
    let dx=e.target.x-e.source.x,dy=e.target.y-e.source.y;
    let dist=Math.sqrt(dx*dx+dy*dy)||1;
    let force=(dist-200)*0.003;
    e.source.vx+=(dx/dist)*force;e.source.vy+=(dy/dist)*force;
    e.target.vx-=(dx/dist)*force;e.target.vy-=(dy/dist)*force;
  });
  graphNodes.forEach(n=>{
    n.vx+=(W/2-n.x)*0.0003; n.vy+=(H/2-n.y)*0.0003;
    n.vx*=0.88; n.vy*=0.88;
    if(n!==gDragging){n.x+=n.vx;n.y+=n.vy;}
  });
}

function drawGraph() {
  if(currentView!=='graph'){requestAnimationFrame(drawGraph);return;}
  ctx.clearRect(0,0,W,H);
  graphEdges.forEach(e=>{
    const hl=gHovered&&(e.source===gHovered||e.target===gHovered)||selectedGraphNode&&(e.source===selectedGraphNode||e.target===selectedGraphNode);
    const dim=(gHovered||selectedGraphNode)&&!hl;
    ctx.beginPath();ctx.moveTo(e.source.x,e.source.y);ctx.lineTo(e.target.x,e.target.y);
    ctx.strokeStyle=dim?'rgba(50,60,80,0.15)':hl?'rgba(74,124,89,0.7)':'rgba(60,80,100,0.25)';
    ctx.lineWidth=hl?2:1;ctx.stroke();
    if(hl){
      const mx=(e.source.x+e.target.x)/2,my=(e.source.y+e.target.y)/2;
      ctx.fillStyle='rgba(74,124,89,0.85)';ctx.font='11px Microsoft YaHei';ctx.textAlign='center';
      ctx.fillText(e.type,mx,my-5);
    }
  });
  graphNodes.forEach(n=>{
    const focus=gHovered||selectedGraphNode;
    const isHov=gHovered===n;const isSel=selectedGraphNode===n;
    const isConn=focus&&graphEdges.some(e=>(e.source===focus&&e.target===n)||(e.target===focus&&e.source===n));
    const dim=focus&&!isHov&&!isSel&&!isConn;
    const r=isHov?n.radius*1.25:n.radius;
    const glow=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r+10);
    glow.addColorStop(0,n.color+'25');glow.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(n.x,n.y,r+6,0,Math.PI*2);ctx.fillStyle=glow;ctx.fill();
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
    ctx.fillStyle=isHov||isSel?n.color:n.color+(dim?'35':'BB');ctx.fill();
    ctx.strokeStyle=isHov||isSel?'#fff':n.color+'50';ctx.lineWidth=isHov||isSel?2:1;ctx.stroke();
    if(n.parent){ctx.beginPath();ctx.arc(n.x,n.y,r-4,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.stroke();}
    ctx.fillStyle=dim?'rgba(200,210,220,0.15)':'rgba(255,255,255,0.92)';
    ctx.font=`${n.parent?'11':'13'}px Microsoft YaHei`;ctx.textAlign='center';ctx.textBaseline='middle';
    const nm=n.name.length>8?n.name.substring(0,7)+'…':n.name;
    ctx.fillText(nm,n.x,n.y);
  });
  forceStep();
  requestAnimationFrame(drawGraph);
}

function getGraphNode(x,y){
  for(let i=graphNodes.length-1;i>=0;i--){
    const dx=x-graphNodes[i].x,dy=y-graphNodes[i].y;
    if(dx*dx+dy*dy<graphNodes[i].radius*graphNodes[i].radius*1.5)return graphNodes[i];
  }
  return null;
}

canvas.addEventListener('mousemove',e=>{
  const n=getGraphNode(e.offsetX,e.offsetY);gHovered=n;
  canvas.style.cursor=n?'pointer':'default';
  if(gDragging){gDragging.x=e.offsetX;gDragging.y=e.offsetY;}
});
canvas.addEventListener('mousedown',e=>{const n=getGraphNode(e.offsetX,e.offsetY);if(n)gDragging=n;});
canvas.addEventListener('mouseup',()=>{gDragging=null;});
canvas.addEventListener('click',e=>{
  const n=getGraphNode(e.offsetX,e.offsetY);
  if(n){selectDomain(n.id);}else{closeDetail();}
});

// ===== ARCHITECTURE VIEW =====
function buildArchView() {
  const view = document.getElementById('arch-view');
  view.innerHTML = '';
  // Relationship overview
  const relMap = document.createElement('div');
  relMap.className = 'rel-map';
  relMap.innerHTML = `<h3 style="color:#e6edf3;margin-bottom:12px">核心关联关系</h3>`;
  KG.relationships.forEach(r => {
    const fromD = nodeMap[r.from], toD = nodeMap[r.to];
    if(!fromD||!toD)return;
    const row = document.createElement('div');
    row.className = 'rel-row';
    row.innerHTML = `<span class="rel-from" style="color:${colorMap[r.from]}">${fromD.name}</span><span class="rel-arrow">→</span><span class="rel-type">${r.type}</span><span class="rel-arrow2">→</span><span class="rel-to" style="color:${colorMap[r.to]}">${toD.name}</span>`;
    relMap.appendChild(row);
  });
  view.appendChild(relMap);

  // Category sections
  categories.forEach(cat => {
    const items = KG.domains.filter(d => d.category === cat && !d.parent);
    if(items.length===0)return;
    const section = document.createElement('div');
    section.className = 'arch-section';
    section.innerHTML = `<div class="arch-section-title"><span class="icon" style="background:${catColors[cat]}">${catIcons[cat]||'●'}</span><span style="color:${catColors[cat]}">${cat}</span></div>`;
    const cards = document.createElement('div');
    cards.className = 'arch-cards';
    items.forEach(item => {
      const subs = KG.domains.filter(d => d.parent === item.id);
      const card = document.createElement('div');
      card.className = 'arch-card';
      card.dataset.id = item.id;
      card.onclick = () => selectDomain(item.id);
      card.innerHTML = `
        <h3><span class="dot" style="background:${colorMap[item.id]}"></span>${item.name}</h3>
        <div class="desc">${item.description}</div>
        <div class="kws">${item.keywords.slice(0,5).map(k=>`<span class="kw">${k}</span>`).join('')}</div>
        <span class="rel-badge">${item.key_files.length} 文件 · ${item.source_folders.length} 目录</span>
        ${subs.length > 0 ? `<div class="arch-sub-cards">${subs.map(s => `
          <div class="arch-sub-card" onclick="event.stopPropagation();selectDomain('${s.id}')">
            <h4><span class="dot" style="background:${colorMap[s.id]}"></span>${s.name}</h4>
            <div class="desc">${s.description}</div>
          </div>`).join('')}</div>` : ''}
      `;
      cards.appendChild(card);
    });
    section.appendChild(cards);
    view.appendChild(section);
  });
}
buildArchView();

// ===== VIEW SWITCH =====
let currentView = 'graph';

function switchView(v) {
  currentView = v;
  document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t.textContent.includes(v==='graph'?'图谱':'架构')));
  canvas.style.display = v==='graph' ? 'block' : 'none';
  document.getElementById('arch-view').style.display = v==='arch' ? 'block' : 'none';
}

// ===== START =====
drawGraph();
</script>
</body>
